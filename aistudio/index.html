<!DOCTYPE html>
<!-- hema-aistudio-v1 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>个人AI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg0:#050914;--bg1:#0a1226;--card:rgba(255,255,255,.045);--line:rgba(120,181,255,.13);
--tx:#eef4ff;--sub:#9fb2d8;--dim:#5f7194;--acc:#3f9dff;--acc2:#7c5cff;--ok:#22c58b;--warn:#ffb020;--bad:#ff5d6c}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#12245c 0%,transparent 60%),radial-gradient(900px 500px at 10% 110%,#0e2a5e 0%,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg0));
color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;overflow-x:hidden;max-width:430px;margin:0 auto;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(420px 220px at 12% 8%,rgba(64,140,255,.14),transparent 70%),radial-gradient(500px 260px at 88% 30%,rgba(124,92,255,.12),transparent 70%),radial-gradient(600px 300px at 50% 100%,rgba(34,197,139,.07),transparent 70%)}
#app{display:flex;min-height:100vh;position:relative;z-index:1}
/* 左图标轨 */
#rail{width:66px;flex:0 0 66px;background:rgba(6,10,24,.72);backdrop-filter:blur(14px);border-right:1px solid var(--line);
display:flex;flex-direction:column;align-items:center;padding:10px 0 90px;gap:2px;overflow-y:auto;position:sticky;top:0;height:100vh;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.rlogo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#2f7bff,#7c5cff);display:flex;align-items:center;justify-content:center;
font-weight:900;font-style:italic;font-size:19px;color:#fff;margin-bottom:8px;box-shadow:0 4px 16px rgba(63,157,255,.4)}
.rbtn{width:58px;border:0;background:none;color:var(--sub);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;
padding:7px 2px;border-radius:12px;cursor:pointer;line-height:1.25}
.rbtn .ic{font-size:19px}
.rbtn.on{background:linear-gradient(135deg,rgba(47,123,255,.85),rgba(64,160,255,.65));color:#fff;box-shadow:0 4px 14px rgba(47,123,255,.35)}
/* 主区 */
.main{flex:1;min-width:0;padding:12px 12px 96px;overflow-x:hidden}
.page{display:none}.page.on{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd h1{font-size:21px;font-weight:800;background:linear-gradient(90deg,#7db9ff,#c9a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd .who{text-align:right;font-size:10px;color:var(--sub);line-height:1.6}
.hero{border-radius:20px;padding:16px;position:relative;overflow:hidden;margin-bottom:12px;min-height:128px;
background:linear-gradient(120deg,#0d1c44 20%,#132a6e 60%,#1b3a8f);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background:
radial-gradient(120px 60px at 78% 30%,rgba(255,214,120,.5),transparent 70%),
radial-gradient(200px 90px at 60% 100%,rgba(64,140,255,.35),transparent 70%);pointer-events:none}
.hero .greet{font-size:16px;font-weight:800;margin-bottom:4px;position:relative;z-index:1}
.hero .date{font-size:11px;color:var(--sub);position:relative;z-index:1}
.hero .castle{position:absolute;right:6px;bottom:0;width:150px;opacity:.95;z-index:0}
.runbadge{position:absolute;right:12px;top:12px;z-index:2;width:64px;height:64px;border-radius:50%;
background:conic-gradient(from 0deg,#22c58b,#3f9dff,#7c5cff,#22c58b);display:flex;align-items:center;justify-content:center;animation:spin 7s linear infinite}
.runbadge b{width:50px;height:50px;border-radius:50%;background:#0a1330;display:flex;align-items:center;justify-content:center;
font-size:8px;color:var(--ok);animation:spin2 7s linear infinite;line-height:1.3;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(-360deg)}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;backdrop-filter:blur(8px)}
.stat .t{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stat .t i{width:26px;height:26px;border-radius:8px;background:rgba(63,157,255,.16);display:flex;align-items:center;justify-content:center;font-size:14px;font-style:normal}
.stat .v{font-size:24px;font-weight:800}
.stat .d{font-size:10px;color:var(--ok);margin-top:4px}
.stat .d.down{color:var(--bad)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px}
.sec-title h3{font-size:15px;font-weight:800}
.sec-title a{font-size:11px;color:var(--sub);cursor:pointer}
/* 横滑模块行：左右滑动查看全部卡片 */
.mods{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.mods::-webkit-scrollbar{display:none}
.mod{flex:0 0 112px;scroll-snap-align:start;min-width:0;border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.12);color:#fff;overflow:hidden}
.mod .mi{width:40px;height:40px;margin:0 auto 8px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px}
.mod b{display:block;font-size:12px;margin-bottom:3px;white-space:nowrap}
.mod span{display:block;font-size:9px;opacity:.85;line-height:1.4;min-height:25px}
.mod .go{display:inline-block;margin-top:6px;font-size:10px;background:rgba(0,0,0,.28);padding:4px 10px;border-radius:20px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;backdrop-filter:blur(8px)}
.card h4{font-size:13px;margin-bottom:8px}
.proj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.pcard b{font-size:12px;display:block;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .tag{font-size:9px;color:var(--sub);margin-bottom:6px;display:block}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px}
.bar2{height:8px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden;margin:6px 0}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#22c58b,#3f9dff);border-radius:5px}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:14px}
/* 表单与列表 */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.fcard h3{font-size:14px;margin-bottom:10px}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:var(--tx);
padding:9px 10px;font-size:13px;margin-bottom:8px;font-family:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button.act{background:linear-gradient(135deg,#2f7bff,#5aa2ff);border:0;color:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
button.act.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:400}
button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer}
.item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item b{font-size:13px}.item p{font-size:11px;color:var(--sub);margin:4px 0;line-height:1.6;word-break:break-all}
.item .meta{font-size:10px;color:var(--dim);margin-top:4px}
.taskrow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.taskrow .no{width:22px;height:22px;border-radius:50%;background:rgba(63,157,255,.18);color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 22px}
.taskrow .tt{flex:1;min-width:0;font-size:12px}
.prio{font-size:9px;padding:2px 8px;border-radius:12px;flex:0 0 auto}
.p-hi{background:rgba(255,93,108,.16);color:#ff8b96}.p-mid{background:rgba(255,176,32,.16);color:#ffcf7a}.p-lo{background:rgba(34,197,139,.14);color:#5fe3ae}
/* 功能目录手风琴 */
.feat{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02)}
.feat>button{width:100%;background:none;border:0;color:var(--tx);text-align:left;padding:11px 12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.feat .f{display:none;padding:4px 12px 12px}
.feat.open .f{display:block}
.feat .f div{font-size:11px;color:var(--sub);padding:5px 0 5px 14px;position:relative;line-height:1.6}
.feat .f div::before{content:"·";position:absolute;left:4px;color:var(--acc)}
.feat .f div b{color:var(--tx);font-weight:600}
/* 部门 */
.dept{margin-bottom:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}
.dept>button{width:100%;background:none;border:0;color:var(--tx);text-align:left;padding:13px;font-size:14px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.dept .mods2{display:none;padding:0 12px 12px;display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dept.open .mods2{display:grid}
.mods2 .mod b{font-size:11px}.mods2 .mod span{font-size:9px;min-height:0}
/* 员工/执行 */
.emp{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.emp .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2f7bff,#7c5cff);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 40px}
.emp .in{flex:1;min-width:0}.emp .in b{font-size:13px}.emp .in p{font-size:10px;color:var(--sub);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.st0{background:#5f7194}.st1{background:#3f9dff;box-shadow:0 0 6px #3f9dff}.st2{background:#22c58b}.st3{background:#ff5d6c}.st4{background:#ffb020}
.step{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:6px}
.step .n{flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:rgba(63,157,255,.16);color:var(--acc);font-size:10px;display:flex;align-items:center;justify-content:center}
.step .b{flex:1;min-width:0}.step .b p{font-size:12px}.step .b small{font-size:10px;color:var(--dim);display:block;margin-top:3px;line-height:1.5}
.stag{font-size:9px;padding:2px 8px;border-radius:10px;flex:0 0 auto}
.kv{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:5px 0;border-bottom:1px solid rgba(120,181,255,.07)}
.kv b{color:var(--tx)}
.note{font-size:10px;color:var(--dim);line-height:1.7;background:rgba(255,176,32,.06);border:1px solid rgba(255,176,32,.2);border-radius:10px;padding:8px 10px;margin:8px 0}
.stars{color:#ffb020;font-size:13px;letter-spacing:2px}
/* 底部导航 */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;
background:rgba(8,13,30,.88);backdrop-filter:blur(18px);border-top:1px solid var(--line);
display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;color:var(--dim);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;padding:4px 0}
.tab .ic{font-size:20px}.tab.on{color:var(--acc)}
.tab .bdg{position:absolute;top:0;right:calc(50% - 20px);background:#ff5d6c;color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.micbtn{flex:1;display:flex;justify-content:center;align-items:flex-start}
.micbtn button{width:56px;height:56px;border-radius:50%;border:3px solid rgba(63,157,255,.35);cursor:pointer;
background:radial-gradient(circle at 35% 30%,#6db4ff,#2f7bff 70%);color:#fff;font-size:24px;margin-top:-24px;box-shadow:0 6px 20px rgba(47,123,255,.5)}
.ver{text-align:center;font-size:9px;color:var(--dim);margin:16px 0 4px}
h2.pt{font-size:17px;margin-bottom:10px}
.searchbar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg1),transparent);padding:4px 0 8px}
</style>
</head>
<body>
<div id="app">
<aside id="rail"></aside>
<main class="main">
<!-- 首页驾驶舱 -->
<section class="page" id="page-home"></section>
<!-- 公司 -->
<!-- AI指挥 -->
<!-- 项目 -->
<section class="page" id="page-projects"></section>

<section class="page" id="page-mod"><div id="modBody"></div></section>

</main>
<nav id="tabbar"></nav>
</div>
<script>
/* ================= 数据层：统一数据库 ================= */
const DBKEY="aistudio_v3";
let db=null;
try{db=JSON.parse(localStorage.getItem(DBKEY))}catch(e){db=null}
if(!db){ // 从 v2 / v1 迁移
  let old=null;try{old=JSON.parse(localStorage.getItem("aistudio_v2"))}catch(e){}
  if(!old){try{old=JSON.parse(localStorage.getItem("ai_company_pro_v1"))}catch(e){}}
  db={biz:[],game:[],media:[],invest:[],ideas:[],tasks:[],money:[],log:[],goals:[],
      know:[],customers:[],employees:[],workflows:[],execs:[],assets:[],publish:[],
      miles:[],files:[],news:[],toolsx:[],clouds:[],contracts:[],appfac:[],prodfac:[],opp:[],backups:[]};
  if(old){["biz","game","media","invest","ideas","tasks","money","log","goals"].forEach(k=>{if(old[k])db[k]=old[k]});
    db.tasks.forEach(x=>{if(x.st===undefined)x.st=x.done?2:0});
    logA("从旧版数据迁移完成");}
}
const ALLCOLLS=["biz","game","media","invest","ideas","tasks","money","log","goals","know","customers","employees","workflows","execs","assets","publish","miles","files","news","toolsx","clouds","contracts","appfac","prodfac","opp","backups","qlist"];
ALLCOLLS.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
if(!db.budgets)db.budgets={};if(!db.settings)db.settings={};
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(e){alert("存储空间不足，备份后清理")}}
function logA(t){db.log.unshift({t,at:Date.now()});db.log=db.log.slice(0,80)}
function uid(){return Date.now()*1000+Math.floor(Math.random()*999)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fdate(ts){const d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
/* ================= 版块定义 ================= */
const SECTIONS=[
 {id:"home",ic:"🏠",name:"首页",tab:"home"},
 {id:"projects",ic:"📁",name:"项目",tab:"projects"},
 {id:"game",ic:"🎮",name:"游戏工作室",dept:"game"},
 {id:"appfac",ic:"🛠",name:"应用工厂",dept:"game"},
 {id:"media",ic:"🎬",name:"内容工作室",dept:"media"},
 {id:"inv",ic:"📈",name:"投资研究",dept:"inv"},
 {id:"tools",ic:"🧰",name:"软件工具",dept:"tech"},
 {id:"cloud",ic:"☁",name:"云服务器",dept:"tech"},
 {id:"news",ic:"🌐",name:"全球资讯",dept:"mkt2"},
 {id:"data",ic:"📉",name:"数据分析",dept:"data"},
 {id:"kb",ic:"🧠",name:"知识大脑",dept:"data"},
 {id:"pl",ic:"📝",name:"提示词库",dept:"data"},
 {id:"files",ic:"🗂",name:"文件中心",dept:"data"},
 {id:"autos",ic:"🔧",name:"自动化",dept:"data"},
 {id:"ideas",ic:"💡",name:"创意库",dept:"data"},
 {id:"daily",ic:"📅",name:"每日任务",dept:"data"},
 {id:"my",ic:"👤",name:"我的",tab:"my"},
];
const DEPTS=[
 {id:"game",ic:"🎮",name:"游戏研发部",color:"linear-gradient(135deg,#7c5cff,#3f9dff)",mods:["game","appfac"],descs:["游戏项目","应用开发工厂"]},
 {id:"media",ic:"🎬",name:"内容制作部",color:"linear-gradient(135deg,#ff5d8f,#ff8a5c)",mods:["media"],descs:["漫剧·视频·小说"]},
 {id:"inv",ic:"📈",name:"投资研究部",color:"linear-gradient(135deg,#22c58b,#3f9dff)",mods:["inv"],descs:["行情·策略·持仓"]},
 {id:"tech",ic:"🛠",name:"技术开发部",color:"linear-gradient(135deg,#3f9dff,#22d3ee)",mods:["tools","cloud","appfac"],descs:["软件工具","云服务器","应用工厂"]},
 {id:"mkt2",ic:"📣",name:"资讯部",color:"linear-gradient(135deg,#ffb020,#ff8a5c)",mods:["news"],descs:["全球资讯"]},
 {id:"data",ic:"🧠",name:"数据研究部",color:"linear-gradient(135deg,#22d3ee,#7c5cff)",mods:["data","kb","pl"],descs:["数据分析","知识大脑","提示词库"]},
];
function secById(id){return SECTIONS.find(s=>s.id===id)}
const NAMES={biz:"创业项目",game:"游戏项目",media:"内容项目",invest:"投资标的",appfac:"应用项目",prodfac:"产品",opp:"赚钱机会"};
const PROJCOLLS={biz:"biz",game:"game",media:"media",inv:"invest",appfac:"appfac",prodfac:"prodfac",opp:"opp"};
/* 真实定时任务清单（自动化中心展示） */
const REALCRONS=[["07:50","全球新闻速览","每天"],["08:00","盘前预判（交易日）","交易日"],["08:00","热榜双榜","每天"],["08:50","Gmail安全汇总","每天"],["09:50","每日资讯APP同步","每天"],["12:50","财富30讲","每天"],["20:30","持仓收益播报","交易日"],["20:50","每日英语","每天"],["21:50","每日一书","每天"],["22:50","书籍自学","每天"],["23:50","财富自学+备份","每天"],["每30分","小说三线并行写作","持续"]];
/* 默认AI员工 */
const DEFAI=[["AI CEO","全局决策","mgmt"],["AI COO","运营管理","mgmt"],["AI CTO","技术管理","tech"],["AI CFO","财务管理","fin"],["AI CMO","营销管理","biz"],["AI 游戏设计师","游戏策划","game"],["AI 程序员","代码开发","tech"],["AI 编剧","剧本创作","media"],["AI 投资研究员","市场研究","inv"],["AI 质量总监","最终验收","mgmt"]];
if(!db.employees.length&&!localStorage.getItem("aistudio_v3_seeded")){
  DEFAI.forEach(a=>db.employees.push({id:uid()+Math.random(),name:a[0],role:a[1],dept:a[2],st:1,at:Date.now()}));
  localStorage.setItem("aistudio_v3_seeded","1");
}
/* ================= 功能目录 ================= */
const FEATS={
"news":[
["全球热点","<b>热点等于影响大加跟你相关，只收这两类。</b>每天固定时间刷一次，看到相关的记一条：一句话加为什么跟你有关。纯吃瓜的不记，信息节食。热点保质期按天算，超过3天没跟进就归档。热点要配行动：这条热点对我意味着什么，能做什么，写下来。"],
["行业新闻","<b>行业新闻按你的业务线分类收：AI、电商、内容、投资。</b>每条记时间加来源加一句话。连续出现3次的同一事件升级为趋势，值得深入研究。趋势单独建档，每月复盘一次走向。看到政策类新闻，第一时间查原文，别只看二手解读。"],

["可信度","<b>可信度分三档：官方或一手为高，大媒体为中，自媒体为低。</b>低可信的只当线索，不直接引用；要引用必须找到高可信来源交叉验证。做决策只用高可信资讯，低可信的看看就行。涉及钱和健康的资讯，可信度标准再提一档，宁可慢不能错。"],
["去重","<b>同一事件只留一条，留最早或最全的那条。</b>看到重复的直接跳过，别反复收。每周清理一次，把过时、被证伪的标出来或删除。知识库贵在精不在多，重复等于噪音。好资讯值得重读，每月挑五条精华重读一遍，常看常新。"],
["发布时间","<b>时间是资讯的保质期，精确到天。</b>收录时记发布时间，超过7天的热点降级为背景资料。做决策只看72小时内的资讯，旧闻不指导今天。紧急事项看小时级更新，别等日报。做复盘时按时间线回看，当时为什么这样判断，校准信息源。"],

function invSetR(v){const a=document.getElementById("icR1"),b=document.getElementById("icR2");if(a)a.value=v;if(b)b.value=v;invCalc();}
function invCalcBind(){["icPmt","icYrs","icR1","icR2","icSplit"].forEach(id=>{const el=document.getElementById(id);if(el){el.addEventListener("input",invCalc);el.addEventListener("change",invCalc)}});invCalc();}
function invCalc(){
  const g=id=>{const el=document.getElementById(id);return el?parseFloat(el.value)||0:0};
  const pmt=g("icPmt"),yrs=g("icYrs"),r1=g("icR1")/100,r2=g("icR2")/100,sp=g("icSplit")/100;
  const svEl=document.getElementById("icSplitV");if(svEl)svEl.textContent=g("icSplit")+"%";
  const n=Math.round(yrs*12);
  const fv=(p,r)=>{if(n<=0||p<=0)return 0;const mr=r/12;if(mr<=0)return p*n;return p*((Math.pow(1+mr,n)-1)/mr)};
  const f1=fv(pmt*sp,r1),f2=fv(pmt*(1-sp),r2),tot=f1+f2,inp=pmt*n,prof=tot-inp;
  const fmt=v=>"\uFFE5"+Math.round(v).toLocaleString("en-US");
  const s1=document.getElementById("icOut1"),s2=document.getElementById("icOut2"),st=document.getElementById("icOutT"),sp2=document.getElementById("icOutP");
  if(s1)s1.textContent=fmt(f1);if(s2)s2.textContent=fmt(f2);if(st)st.textContent=fmt(tot);
  if(sp2)sp2.textContent=fmt(inp)+" / "+(prof>=0?"+":"")+fmt(prof).slice(1).replace(/^/,"\uFFE5");
  try{localStorage.setItem("aistudio_invcalc",JSON.stringify({pmt:pmt,yrs:yrs,r1:g("icR1"),r2:g("icR2"),split:g("icSplit")}))}catch(e){}
}

    +'<button class="ghost" onclick="addMile('+p.id+',\''+esc(p.name)+'\')">+里程碑</button>'
    +'<button class="ghost" onclick="delProj(\''+id+'\','+p.id+')">删除</button></div></div>'}).join("");

function addProj(id){

function newExec2(){
const n=document.getElementById("exName2").value.trim(),q=document.getElementById("exReq2").value.trim(),dp=document.getElementById("exDept2").value;
if(!n||!q)return alert("填写任务名称和需求描述");
const steps=["需求分析：拆解需求要点","制定方案：输出执行方案","AI执行：生成指令发创始人（我）执行","结果检查：核对交付物","用户验收：等你确认","交付归档：记录归档"].map(t=>({t,st:0,note:""}));
db.execs.push({id:uid(),name:n,req:q,dept:dp,steps,cur:0,st:0,at:Date.now()});
logA("执行引擎接单："+n);save();render();

function addWf(){const n=document.getElementById("wfN").value.trim();const ss=document.getElementById("wfS").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!n||!ss.length)return alert("填写名称和至少一步");db.workflows.push({id:uid(),name:n,steps:ss.map(t=>({t,st:0})),st:0,at:Date.now()});logA("新建工作流："+n);save();render()}
function wfStep(wid,i,d){const w=db.workflows.find(x=>x.id===wid);if(!w)return;const j=i+d;if(j<0||j>=w.steps.length)return;const t=w.steps[i];w.steps[i]=w.steps[j];w.steps[j]=t;save();render()}
function wfTog(wid,i){const w=db.workflows.find(x=>x.id===wid);if(!w)return;w.steps[i].st=w.steps[i].st?0:1;if(w.steps.every(s=>s.st))w.st=2;save();render()}
function wfRun(wid){const w=db.workflows.find(x=>x.id===wid);if(!w)return;w.st=w.st===1?0:1;logA((w.st===1?"运行工作流：":"暂停工作流：")+w.name);save();render()}
function wfDel(wid){if(!confirm("删除？"))return;db.workflows=db.workflows.filter(x=>x.id!==wid);save();render()}

function dlBlob(content,name,type){
const b=new Blob([content],{type:type+";charset=utf-8"});const u=URL.createObjectURL(b);
const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},800);
}

function addGoal(){
  const n=document.getElementById("goalName").value.trim(),t=+document.getElementById("goalTarget").value,c=+document.getElementById("goalCur").value||0;
  if(!n||!(t>0))return alert("填写目标名称和目标值");
  db.goals.push({id:uid(),name:n,target:t,cur:c,at:Date.now()});
  logA("新增目标："+n);save();render();
}
function goalStep(id,d){const g=db.goals.find(g=>g.id===id);if(!g)return;g.cur=Math.max(0,g.cur+d);save();render()}
function delGoal(id){if(!confirm("删除？"))return;db.goals=db.goals.filter(g=>g.id!==id);save();render()}
function mkBackup(){
  const snap={at:Date.now(),size:ALLCOLLS.reduce((s,k)=>s+(db[k]||[]).length,0),data:JSON.stringify(db)};
  if(!db.backups)db.backups=[];
  db.backups.push({at:snap.at,size:snap.size,data:snap.data});
  db.backups=db.backups.slice(-5);
  logA("创建数据快照");save();render();alert("快照已保存");
}
function restoreBackup(i){
  if(!confirm("回滚到该快照？当前数据将被替换！"))return;
  const b=db.backups[i];if(!b)return;
  const cur=JSON.stringify(db);
  db=JSON.parse(b.data);
  if(!db.backups)db.backups=[];
  save();logA("数据回滚到快照");save();render();alert("已回滚");
}
function impJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object")throw 0;db=d;ALLCOLLS.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});logA("导入数据");save();render();alert("导入成功")}catch(e){alert("文件格式不对")}};
  r.readAsText(f);
}
function wipeData(){if(confirm("清空本机全部数据？此操作不可恢复！建议先备份快照。")){localStorage.removeItem(DBKEY);location.reload()}}

function render(){
  buildTabs();
  if(curTab==="home"){renderHome();showPage("home");var ht=document.getElementById("homeToday");if(ht)ht.innerHTML=homeTodayHTML()}
  else if(curTab==="projects"){renderProjects();showPage("projects")}
  else if(curTab==="inv"){renderMod("inv");showPage("mod");if(window.scrollTo)window.scrollTo(0,0)}
  else if(curTab==="my"){document.getElementById("page-my").innerHTML=myHTML();showPage("my")}
  else if(curTab==="__mod"&&curMod){renderMod(curMod);showPage("mod");
    if(curMod==="money")chgCat();if(curMod==="pl")renderPlList();
    if(window.scrollTo)window.scrollTo(0,0);}
}

const PROMPTS=[{n:1,t:"碎片记录 → 周报/月报",s:"把零散口语记录变成正式汇报",p:"下面是我的工作记录（零散、口语化），请帮我整理成一份正式的【周报/月报】。\n要求：\n1. 分为：本期完成事项、关键数据/成果、遇到的问题、下期计划四个部分\n2. 语言简洁专业，适合发给【领导/合伙人】看\n3. 把口语表达转成书面语，但不要编造我没提到的数据\n4. 最后附 3 条你对我下期工作的建议\n我的记录如下：\n【粘贴你的记录】",c:"汇报总结"},{n:2,t:"述职总结提炼",s:"STAR 法则组织成果，适合口头汇报",p:"你是一名资深管理者。请根据我提供的年度工作素材，帮我写一份述职总结提纲。\n要求：\n1. 用 STAR 法则（背景-任务-行动-结果）组织每个重点成果\n2. 成果部分尽量量化，没有数据的标注【待补充数据】\n3. 不足与改进部分要真诚具体，不说空话\n4. 控制在 800 字以内，适合 5 分钟口头汇报\n我的素材：\n【粘贴素材】",c:"汇报总结"},{n:3,t:"数据 → 结论解读",s:"把经营数字变成判断和行动",p:"我有一组经营数据，请帮我做解读：\n数据：【粘贴数据，如：本月营业额 X 元，环比 +Y%，客单价 Z 元……】\n要求：\n1. 先给一句话结论：生意是变好还是变坏\n2. 找出 2-3 个最值得关注的变化，并分析可能原因\n3. 给出 3 条具体可执行的改进建议\n4. 不要只复述数字，要说数字背后的意思",c:"汇报总结"},{n:4,t:"会前议程设计",s:"给议题自动生成讨论框架",p:"我要开一个关于【主题，如：中秋促销方案】的会，参会人有【人员】，时长约【X 分钟】。\n请帮我设计会议议程：\n1. 开场目标说明（一句话）\n2. 讨论议题清单（每个议题标注：通报/讨论/决策）\n3. 每个议题的建议时长和引导问题\n4. 会议结束前要确认的待办事项模板",c:"开会"},{n:5,t:"会议纪要整理",s:"录音转文字一键变成纪要+待办",p:"下面是我的会议记录（可能是录音转文字，比较乱），请整理成正式会议纪要：\n要求：\n1. 格式：时间、参会人、议题、讨论要点、决议事项、待办（负责人+截止时间）\n2. 决议事项用加粗标出\n3. 待办事项单独列成清单，方便我复制到任务管理里\n4. 删掉闲聊和重复内容\n记录如下：\n【粘贴记录】",c:"开会"},{n:6,t:"会议发言稿（3 分钟版）",s:"开口就能念",p:"我要在【什么会】上发言，主题是【主题】，想表达的核心观点是【观点】，听众是【谁】。\n请帮我写一份 3 分钟发言稿：\n1. 开头一句话抓住注意力\n2. 只讲 3 个要点，每个要点有事实或例子支撑\n3. 结尾给出明确的请求或行动呼吁\n4. 口语化，适合直接念",c:"开会"},{n:7,t:"问题诊断（找根因）",s:"连续 5 个为什么，先想透再解决",p:"我的店/工作遇到了这个问题：【描述问题，如：最近一周卤味销量下滑 20%】。\n请用\"连续追问 5 个为什么\"的方法帮我找根本原因：\n1. 每次追问都要基于上一个答案\n2. 区分哪些是事实、哪些是我的猜测\n3. 最后给出最可能的 2-3 个根因，以及验证每个根因的方法\n4. 不要急着给解决方案，先帮我把问题想透",c:"分析决策"},{n:8,t:"方案对比决策",s:"打分表帮你选",p:"我要在以下几个方案里做选择：【方案A/B/C 简述】。\n请帮我做决策分析：\n1. 列出决策标准（如成本、见效速度、风险、可操作性），并说明权重\n2. 给每个方案在每项标准上打分（1-5 分）\n3. 算出加权总分并排序\n4. 指出每个方案最大的风险点\n5. 最后给出你的推荐和理由（一句话）",c:"分析决策"},{n:9,t:"唱反调（找漏洞）",s:"专门挑毛病，不说客套话",p:"这是我的计划/想法：【粘贴计划】。\n请你扮演反对者，专门挑毛病：\n1. 找出计划里最脆弱的 3 个假设\n2. 每个假设如果被证伪，会有什么后果\n3. 提出 2 个我没考虑到的风险场景\n4. 最后给 1-2 条补救建议\n要求：只讲干货，不说客套话",c:"分析决策"},{n:10,t:"新品规划",s:"按季节成本客群设计新品",p:"我开熟食店，主打【卤味/凉菜等】，客群是【周边居民/上班族等】，现在是【季节】。\n请帮我规划 1-2 款新品：\n1. 推荐品类并说明理由（季节、成本、客群口味）\n2. 给出大致配方思路和关键调味比例方向\n3. 估算单份成本区间和建议售价（毛利率不低于 50%）\n4. 上市前的小批量试销验证方法",c:"熟食店经营"},{n:11,t:"成本核算与定价",s:"算出保本价和建议售价",p:"请帮我给这道熟食菜品做成本核算和定价：\n菜品：【名称】；原料及用量：【列出】；原料单价：【列出】；\n要求：\n1. 算出单份原料成本\n2. 加上 15% 的损耗和水电人工分摊，给出完全成本\n3. 按目标毛利率【如 55%】倒推建议售价\n4. 对比周边同类售价【如有】，给出最终定价建议\n5. 列成表格，方便我保存",c:"熟食店经营"},{n:12,t:"促销文案",s:"朋友圈海报文案 3 个版本",p:"我要为【产品/活动，如：中秋卤味礼盒】写促销文案，发布在【朋友圈/店内海报/社群】。\n信息点：【价格、优惠、时间、限量等】。\n要求：\n1. 标题 15 字以内，有钩子\n2. 正文 100 字以内，讲清\"买什么、多少钱、为什么现在买\"\n3. 结尾有明确的行动指令\n4. 给我 3 个版本：热情版、实在版、幽默版",c:"熟食店经营"},{n:13,t:"食品安全自查",s:"每天打勾拍照存档",p:"我是熟食店老板，请帮我生成一份食品安全日常自查清单：\n1. 按区域分：操作间、展示柜、切肉台、冷藏、仓库、店面环境\n2. 每项检查点说明\"查什么、合格标准是什么\"\n3. 特别加强：展示柜和切肉台的防蝇防虫检查项\n4. 输出成打勾清单格式，我每天打完勾拍照存档",c:"熟食店经营"},{n:14,t:"员工排班与管理",s:"小店排班表+低成本留人",p:"我的熟食店有【X 名员工】，营业时间【如 8:00-21:00】，岗位有【切配/售卖/收银等】。\n请帮我：\n1. 设计一周排班表，保证高峰时段【如 11:00-13:00、17:00-19:00】人力充足\n2. 每人每周休息【X 天】，工时尽量均衡\n3. 附 3 条低成本留人建议（适合小店）\n员工情况：【补充每人可上班时间/特长】",c:"熟食店经营"},{n:15,t:"供应商谈判",s:"压价话术和底线策略",p:"我要跟【原料，如猪肉/调料】供应商谈价格，目前拿货价【X 元/斤】，月用量约【Y 斤】。\n请帮我准备谈判话术：\n1. 开场怎么说（表明长期合作意向）\n2. 压价的 3 个理由（用量、账期、备选供应商）\n3. 对方拒绝时的话术和让步策略\n4. 谈判底线和目标价位\n5. 3 个判断供应商是否靠谱的提问",c:"熟食店经营"},{n:16,t:"顾客投诉处理",s:"现场话术+补偿+复盘",p:"顾客投诉：【描述，如：说卤猪蹄有异味】。\n请帮我：\n1. 现场应对话术（先安抚、再核实、给方案，三步走，话术要口语化）\n2. 3 种补偿方案（按成本从低到高）\n3. 事后复盘：要检查的 5 个环节（原料、制作、保存、陈列、时间）\n4. 一条发朋友圈/群里的情况说明模板（如需公开回应）",c:"熟食店经营"},{n:17,t:"通知公告",s:"店内/顾客群通知两个版本",p:"帮我写一则【店内/顾客群】通知，事项是：【如：春节营业时间调整】。\n要求：标题醒目、时间地点讲清、语气亲切、50 字以内，附 1 个表情符号版本和 1 个正式版本",c:"沟通写作"},{n:18,t:"请示/申请",s:"诚恳不卑不亢",p:"我要向【房东/供应商/管理部门】申请【事项，如：缓交半个月租金】。\n请帮我写一份简短正式的申请：\n1. 说明事由（一句话）\n2. 提出具体请求（含时间和数字）\n3. 给出对方可接受的理由\n4. 结尾留有商量余地\n语气：诚恳、不卑不亢",c:"沟通写作"},{n:19,t:"想法 → 行动计划",s:"拆成能干起来的步骤",p:"我有个想法：【描述，如：想在店门口加个试吃台】。\n请帮我把它变成可执行的行动计划：\n1. 拆成 5 步以内的具体步骤\n2. 每步标注：负责人、完成时间、需要多少钱\n3. 列出可能遇到的 2 个障碍和预案\n4. 第一周的最小可行动作是什么（先干起来）",c:"沟通写作"},{n:20,t:"写文案（小红书/朋友圈/公众号）",s:"给主题出成稿",p:"我要发一篇【平台，如小红书】文案，主题是【主题】，目的是【引流/卖货/通知】。\n信息点：【列出关键信息】。\n要求：\n1. 标题党一点但不说谎，15 字以内\n2. 正文分段清晰，口语化，有表情符号点缀但不堆砌\n3. 结尾有行动号召（关注/私信/到店）\n4. 给我 2 个版本：A 版直接发，B 版更活泼",c:"AI 工具"},{n:21,t:"草稿润色",s:"口语变书面，书面变口语",p:"帮我润色下面这段文字，目标是【更专业/更口语/更简洁】：\n要求：\n1. 不改变原意，不编造新信息\n2. 标出你改动最大的 3 处，并说明为什么这样改\n3. 给我润色版和原文对照\n原文：\n【粘贴原文】",c:"AI 工具"},{n:22,t:"扩写/压缩",s:"字数不够或太啰嗦",p:"把下面这段文字【扩写到约 X 字 / 压缩到 X 字以内】：\n要求：\n1. 核心观点一个不丢\n2. 扩写时加例子和细节；压缩时只留骨架\n3. 语气保持【正式/轻松】不变\n原文：\n【粘贴原文】",c:"AI 工具"},{n:23,t:"文字转表格",s:"一键整理成表",p:"把下面的信息整理成表格：\n要求：\n1. 列名：【如：菜品/成本/售价/毛利率】\n2. 数字对齐，单位统一\n3. 用 Markdown 表格输出，方便我复制到 Excel\n4. 最后加一行合计/平均（如适用）\n内容：\n【粘贴内容】",c:"AI 工具"},{n:24,t:"Excel 公式",s:"说人话，给公式",p:"我在做 Excel 表，需求是：【描述，如：A 列是日期，B 列是销售额，我想算出每个月的总销售额】。\n请：\n1. 直接给出公式（能复制粘贴用）\n2. 解释公式每部分的意思（一句话一个）\n3. 提醒 1 个新手最容易踩的坑\n我的 Excel 版本是【WPS/Office 365/2016】",c:"AI 工具"},{n:25,t:"数据分析",s:"粘贴数据，要结论",p:"帮我分析这组数据：【粘贴数据或描述表结构】。\n要求：\n1. 先说一句话结论\n2. 找出异常值和趋势（用具体数字说话）\n3. 分析 2 个可能的原因\n4. 给 3 条可执行的建议\n5. 如果数据不够下结论，直接说缺什么数据",c:"AI 工具"},{n:26,t:"写代码/调 Bug",s:"描述需求或贴报错",p:"我要【用 Python 写个脚本，把文件夹里的图片按日期重命名 / 调这个报错】。\n【粘贴需求描述或报错信息 + 相关代码】\n要求：\n1. 给完整可运行的代码，不要省略号\n2. 每段关键代码加中文注释\n3. 告诉我运行前要装什么、注意什么\n4. 如果是调 Bug：先说报错原因，再给修复后的完整代码",c:"AI 工具"},{n:27,t:"学新东西",s:"小白讲解+测验",p:"我想学会【如：看懂资产负债表】，我是零基础。\n请：\n1. 用打比方的方式讲核心概念（不超过 5 个）\n2. 每个概念配 1 个生活中的例子\n3. 讲完出 3 道选择题考我，我答完再讲下一部分\n4. 最后给我一份\"继续学\"的清单",c:"AI 工具"},{n:28,t:"翻译",s:"保留语气，术语标注原文",p:"把下面这段【中文翻英文 / 英文翻中文】：\n要求：\n1. 保留原文语气（【正式/幽默/口语】）\n2. 专业术语第一次出现时标注原文\n3. 翻完后用一句话说明你觉得最难翻的一处是怎么处理的\n原文：\n【粘贴原文】",c:"AI 工具"},{n:29,t:"做计划",s:"学习/健身/经营计划",p:"帮我制定一份【如：30 天短视频学习计划】：\n我的情况：【基础、每天能投入的时间、目标】。\n要求：\n1. 按周拆分，每周有明确产出物\n2. 每天的任务不超过【X】项，能落地\n3. 标注哪些天可以休息/弹性\n4. 第 1 周的任务细化到每天",c:"AI 工具"},{n:30,t:"头脑风暴",s:"要数量也要质量",p:"我要给【产品/店铺/活动】想创意，主题是【如：熟食店周年庆】，预算约【X 元】。\n请：\n1. 先给 10 个点子，数量优先，不评判\n2. 再从中挑 3 个最靠谱的，说明为什么\n3. 每个靠谱点子配 1 句落地做法和预估成本\n4. 最后问我 1 个问题帮我收窄方向",c:"AI 工具"},{n:31,t:"起名",s:"店铺/产品/账号",p:"帮我给【如：新开的卤味店】起名字：\n要求：\n1. 给 10 个候选：5 个直白好记的，5 个有创意的\n2. 每个名字配一句话说明好在哪\n3. 排除生僻字，适合做招牌和外卖平台名\n4. 标出你最推荐的 3 个并排序\n补充信息：【定位/客群/想突出的特点】",c:"AI 工具"},{n:32,t:"写邮件/正式函件",s:"得体不啰嗦",p:"帮我写一封【邮件/函】给【对象】，事由是【一句话】。\n要求：\n1. 标题直接说明来意\n2. 正文不超过 200 字：背景一句、请求一句、时间节点一句\n3. 语气【客气坚定/友好协商】\n4. 结尾留联系方式占位【电话】",c:"AI 工具"},{n:33,t:"长文档总结",s:"10 页变 1 页",p:"下面是一篇长文档/文章，请帮我总结：\n要求：\n1. 先用 3 句话说清核心观点\n2. 列出 5 个关键要点（每点一句话）\n3. 标出 1 个最有争议/最值得思考的观点\n4. 最后给\"一句话行动建议\"\n文档：\n【粘贴文档】",c:"AI 工具"},{n:34,t:"角色扮演",s:"模拟谈判/面试/客服",p:"请你扮演【如：挑剔的顾客】，我扮演【店主】，模拟【如：顾客投诉卤味太咸】的对话。\n规则：\n1. 你先开口，语气要像真人（带点情绪）\n2. 我每回复一次，你先点评我的回复（哪里好、哪里可以更好），再继续扮演\n3. 进行 5 轮后，给我一份总复盘和 3 句万能话术",c:"AI 工具"},{n:35,t:"PPT 大纲",s:"10 分钟讲清",p:"我要做一份 PPT，主题【如：本季度经营复盘】，给【谁】看，时长约【X 分钟】。\n请帮我列大纲：\n1. 封面标题（有吸引力的一句话）\n2. 每页一个标题 + 3 个要点\n3. 哪几页放数据图（注明图的类型）\n4. 结尾页：明确的结论或行动呼吁\n5. 备注：每页的讲解提示（一句话）",c:"AI 工具"},{n:36,t:"帮我做选择",s:"消费/决策对比",p:"我在纠结买【A 和 B，如：两款手机】，信息如下：【粘贴参数/价格/你的需求】。\n请：\n1. 先问我 3 个问题搞清我的真实需求（如果信息不足）\n2. 列对比表：只对比对我有用的维度\n3. 直接给推荐并说理由（一句话）\n4. 说清楚选它的代价（缺点）是什么",c:"AI 工具"},{n:37,t:"落地页生成",s:"一句话需求变完整页面",p:"我要做一个【产品/活动，如：卤味店中秋礼盒】的宣传落地页。\n请用单个 HTML 文件实现（含内联 CSS/JS，不依赖外部资源）：\n1. 结构：顶部导航、主视觉区（标题+副标题+行动按钮）、卖点区（3-4 个）、价格/套餐区、用户评价区、底部联系方式\n2. 风格：【如：iOS 玻璃拟态、暖色 appetizing】，主色【】，圆角卡片\n3. 移动端优先，桌面端自适应；支持深色模式更佳\n4. 行动按钮要有点击反馈（如弹窗/跳转【链接】）\n5. 代码完整可直接保存为 .html 打开",c:"网页"},{n:38,t:"单文件工具页",s:"小工具一次成型",p:"帮我做一个单文件网页小工具：【如：熟食成本计算器】。\n功能：【描述，如：输入原料用量和单价，自动算出单份成本和建议售价】\n要求：\n1. 单个 HTML 文件，CSS/JS 全部内联，离线可打开\n2. 手机上好用：大按钮、大字号，输入框好点\n3. 数据存在浏览器 localStorage，刷新不丢失\n4. 有一键清空和一键复制结果按钮\n5. 代码加中文注释，方便我以后改",c:"网页"},{n:39,t:"个人主页/作品集",s:"展示型页面",p:"帮我做一个个人主页，介绍【我是谁/我的店】。\n内容：【一句话介绍、3-5 个亮点、联系方式/地址】\n要求：\n1. 单文件 HTML，风格【简约高级/活泼年轻】，配色【】\n2. 首屏一句话抓住人，往下滚动讲故事\n3. 手机端完美显示，图片用占位色块代替（我自己换图）\n4. 加一个\"联系我\"按钮，点击弹出微信号/电话【】",c:"网页"},{n:40,t:"网页改版优化",s:"指出问题给方案",p:"这是我的网页【粘贴代码或描述网址】，请帮我优化：\n1. 先指出 3 个最影响体验的问题（加载、排版、手机端）\n2. 每个问题给具体修改方案（改哪段代码/怎么改）\n3. 优化后的完整代码（单文件，保持原有功能）\n4. 最后列一个\"我自己就能做的日常维护清单\"",c:"网页"},{n:41,t:"把想法变成页面",s:"口述需求转结构",p:"我有个网页想法：【描述，如：想做个记录每天卖了多少卤味的页面】。\n请先帮我梳理：\n1. 这个页面需要哪几个区块（按浏览顺序列）\n2. 每个区块放什么内容、解决什么问题\n3. 需要用户输入什么、页面反馈什么\n4. 确认后，再给我完整单文件 HTML 代码",c:"网页"},{n:42,t:"表单/问卷页",s:"收集信息用",p:"帮我做一个【顾客满意度问卷/订货登记】表单页：\n字段：【列出，如：姓名、电话、要订的菜品、取货时间】\n要求：\n1. 单文件，手机填写顺手（大输入框、日期时间选择器用原生控件）\n2. 必填项有*标记，提交前校验（手机号格式等）\n3. 提交后显示成功页，并把填写内容整理成文本方便我复制\n4. 配色跟我的店招一致：【主色】",c:"网页"},{n:43,t:"App 界面描述",s:"一句话画出界面",p:"帮我设计一个 App 页面：【如：熟食店点单页】。\n请用文字精确描述 UI，方便我交给 AI/设计师实现：\n1. 页面结构（从上到下每个区域）\n2. 每个区域的组件（导航栏/搜索框/卡片列表/底部按钮）\n3. 配色、圆角、字号、间距的具体数值\n4. 关键交互（点击、滑动、上拉加载的效果）\n5. 空状态和加载状态长什么样",c:"UI"},{n:44,t:"设计规范",s:"配色字体一次定好",p:"帮我定一套 UI 设计规范，用于【我的熟食店小程序/网页】：\n1. 主色、辅助色、成功/警告/错误色（给 hex 值）\n2. 标题/正文/小字的字号和字重\n3. 按钮（主要/次要/禁用）三种状态的样式\n4. 卡片圆角、阴影、间距规范\n5. 输出成一份我可以直接发给开发者的文档",c:"UI"},{n:45,t:"组件设计",s:"按钮卡片弹窗",p:"帮我设计一个【如：商品卡片】组件：\n场景：【如：点单页的菜品展示】\n要求：\n1. 描述组件的每个元素（图片区/标题/价格/加购按钮）\n2. 三种状态：默认、售罄、已加入购物车\n3. 给出 HTML+CSS 代码片段（可直接用）\n4. 手机端和桌面端的差异处理",c:"UI"},{n:46,t:"深色模式适配",s:"一套代码两种皮肤",p:"我有个页面【粘贴代码】，请帮我加深色模式：\n1. 用 CSS 变量重构颜色（--bg、--text、--card 等）\n2. 跟随系统 prefers-color-scheme 自动切换\n3. 加一个手动切换按钮，记住用户选择（localStorage）\n4. 深色下保证文字对比度足够\n5. 输出完整代码，浅色外观保持不变",c:"UI"},{n:47,t:"动效设计",s:"让页面活起来",p:"我的页面【描述/粘贴代码】太死板，请加动效：\n1. 页面载入：元素依次淡入上浮\n2. 按钮：点击有按压缩放反馈\n3. 卡片：悬停上浮阴影（手机端改成点击反馈）\n4. 弹窗/页面切换：300ms 内的过渡动画\n5. 全部用 CSS 实现，不引入动画库；加一个关闭动效的开关",c:"UI"},{n:48,t:"图标/Logo 创意",s:"先出方案再动手",p:"我要给【熟食店/新产品】设计一个 Logo/图标：\n1. 先给 3 个创意方向（每个一句话+为什么合适）\n2. 我选定后，用 SVG 代码画出来（单色、可缩放）\n3. 给出在浅色/深色背景下的两个版本\n4. 附 1 句使用建议（最小尺寸、留白）",c:"UI"},{n:49,t:"文案质感提升",s:"普通话术变高级",p:"把下面这段文案改得更有质感（高级、克制、有品味）：\n要求：\n1. 删掉所有\"超值\"\"爆款\"\"震惊\"这类廉价感词汇\n2. 多用感官细节和具体数字，少用形容词堆砌\n3. 短句为主，有留白感\n4. 给我改写版，并标出 3 处最关键的改动\n原文：【粘贴原文】",c:"质感"},{n:50,t:"品牌调性定义",s:"一句话定下高级感",p:"帮我为【品牌/店铺，如：我的卤味店】定义品牌调性，方向是【轻奢/新中式高级感/侘寂风等】：\n1. 用 3 个关键词定义气质\n2. 写一句品牌 Slogan（不超过 12 字）\n3. 列出\"说人话版\"的语气规范：说什么、不说什么（各 3 条）\n4. 举 1 个例子：同一句话，普通版 vs 有质感版",c:"质感"},{n:51,t:"网页质感升级",s:"5 个细节拉开差距",p:"我的网页【粘贴代码/描述】想提升质感，请给具体方案：\n1. 留白：哪里该空出来，空多少\n2. 字体：标题和正文用什么字重、字号、行高\n3. 色彩：把现有配色压成低饱和版本（给 hex）\n4. 动效：加 2 处克制的微动效（慢淡入、细线条生长）\n5. 细节：分割线、圆角、阴影的统一数值\n要求：改动小、效果明显，输出可直接用的 CSS 片段",c:"质感"},{n:52,t:"视觉质感词库",s:"AI 作图高级感关键词",p:"我要用 AI 生成【产品图/海报背景/头像】，想要【电影感/胶片质感/轻奢】风格。\n请给我：\n1. 一组可直接拼进提示词的质感关键词（中英对照，如 cinematic lighting、film grain、soft shadows）\n2. 3 个完整示例提示词（中文场景描述 + 英文质感后缀）\n3. 2 个避坑提醒（哪些词会让图显廉价）",c:"质感"},{n:53,t:"产品摄影指导",s:"手机拍出质感",p:"我要用手机给【卤味/产品】拍质感照片，发朋友圈/上架外卖平台：\n1. 背景：用什么颜色/材质（3 种低成本方案）\n2. 布光：自然光怎么摆，阴影怎么处理\n3. 构图：3 个万能构图公式\n4. 后期：手机修图 3 步（曝光/色温/锐化给具体数值方向）\n5. 1 个\"千万别\"清单",c:"质感"},{n:54,t:"高级配色方案",s:"低饱和莫兰迪",p:"帮我配一套有质感的配色，用于【网页/海报/店铺招牌】：\n1. 主色 1 个 + 辅助色 2 个 + 点缀色 1 个（给 hex，低饱和方向）\n2. 每个颜色标注用在哪（背景/标题/按钮/强调）\n3. 深色模式下的对应色\n4. 1 句口诀帮我记住这套配色的感觉",c:"质感"},{n:55,t:"排版质感",s:"字距行距的讲究",p:"帮我检查这段排版【粘贴文字/截图描述】，提升质感：\n1. 标题/正文/注释的字号字重行高给具体数值\n2. 哪里该加粗、哪里该留白\n3. 数字和英文混排时的细节（空格、字体）\n4. 输出一份\"排版检查清单\"，我以后自己对着查",c:"质感"},{n:56,t:"社交媒体推广图",s:"社媒宣传一键出图",p:"为【品牌名】创建一张精致的社交媒体推广图，这是一个服务【目标受众】的【业务类型】。\n这张图的目的是推广【活动 / 优惠 / 信息】。\n最核心要传达的信息是【核心信息】。\n整体风格应该是【3 个品牌形容词】。\n图片格式为【Instagram 帖子 / LinkedIn 帖子 / Facebook 帖子 / Story / ……】。",c:"设计"},{n:57,t:"产品广告图",s:"真实产品做主视觉",p:"为【产品名】创建一张高清广告图，这是一款为【目标客户】打造的【产品类型】。\n主要目标是立刻传达【核心卖点 / 优惠】。\n以真实产品为主视觉焦点，放在【居中 / 左侧 / 右侧】。\n背景：【背景描述】\n环境：【影棚 / 生活方式场景 / 户外 / 豪华室内 / 抽象】\n光线：【柔和影棚光 / 电影感光影 / 自然光 / ……】",c:"设计"},{n:58,t:"活动海报",s:"信息齐全的专业海报",p:"为【活动名称】设计一张专业海报，时间是【日期】，地点在【地点】。\n活动主题是【主题】，面向【受众】。\n视觉方向用【氛围 / 设计风格】。\n包含：\n活动标题：【标题】\n日期：【日期】\n时间：【时间】\n地点：【地点】\n演讲者或主持人：【姓名】\nCTA：【报名 / 购票 / 了解更多】",c:"设计"},{n:59,t:"YouTube 缩略图",s:"高点击率封面",p:"为标题是【视频标题】的视频创建一张高点击率 YouTube 缩略图。\n视频讲的是【主题】，目标观众是【受众】。\n缩略图需要在一秒内传达【核心观点 / 情绪 / 结果】。\n以【人物 / 产品 / 物体】作为主视觉焦点。\n缩略图文字：【2 到 5 个词】\n主体放在【左侧 / 右侧】，文字放在另一侧。",c:"设计"},{n:60,t:"书籍封面",s:"有记忆点的封面概念",p:"为【作者名】的【书名】设计一张书籍封面。\n类型：【类型】\n目标读者：【受众】\n核心主题：【主题】\n期望氛围：【氛围】\n围绕一个令人记住的视觉创意做封面概念。\n包含：\n书名：【书名】\n副标题：【副标题】\n作者：【作者】\n字体要体现【类型 / 时代 / 调性】。",c:"设计"},{n:61,t:"餐厅菜单",s:"字体层级清晰的菜单",p:"为【餐厅名】设计一份菜单，这是一家【菜系类型】餐厅，氛围是【休闲 / 高端 / 家庭 / 精致餐饮】。\n菜单分区：\n【前菜】\n【主菜】\n【配菜】\n【甜点】\n【饮品】\n使用【设计风格】和【配色方案】。\n为以下内容建立清晰的字体层级：\n分区标题\n菜品名称\n描述\n价格\n饮食信息",c:"设计"},{n:62,t:"信息图",s:"两分钟讲清一个主题",p:"创建一张顶级信息图，向【目标受众】解释【主题】。\n读者应该在两分钟内理解【主要学习成果】。\n把信息组织为：\n1.【部分 1】\n2.【部分 2】\n3.【部分 3】\n4.【部分 4】\n5.【部分 5】\n用【数据 / 统计 / 流程步骤 / 对比】作为主要信息组织。\n从上到下建立清晰的视觉层级。",c:"设计"},{n:63,t:"移动应用界面",s:"App 界面出图",p:"为【应用名】设计一个移动应用界面，这是一款帮助用户【主要功能】的应用。\n设计【首页 / 仪表盘 / 个人资料 / 结账 / 引导】页面。\n主要用户操作是【主要操作】。\n次要操作：\n【操作 2】\n【操作 3】\n【操作 4】\n界面风格用【极简 / 专业 / 活泼 / 高端】。\n屏幕尺寸：【设备 / 尺寸】。",c:"设计"},{n:64,t:"视频反推·快速通用版",s:"上传视频，一键反推完整可用的生成提示词",p:"请根据上传视频，反推一套完整、可直接使用的 AI 视频生成提示词。\n\n要求：提示词表达无歧义、高度可执行，严禁模糊抽象表述，每一项都必须具体到可视化、可落地。\n\n提示词必须覆盖以下 7 项核心要素：\n\n1. 主体\n明确视频核心对象的所有关键细节。\n人物：年龄段、性别、种族、体态（身高体型比例）、面部特征（脸型、五官比例、肤质）、发型（长度 / 颜色 / 造型 / 发质）、妆容（眼妆 / 唇色 / 腮红 / 高光）、服装（款式 / 面料 / 颜色 / 图案 / 合身度）、配饰（耳饰 / 项链 / 手表 / 眼镜 / 帽子）、情绪状态与整体气质。\n物品：尺寸比例、材质（金属 / 木质 / 塑料 / 玻璃 / 织物）、颜色与饱和度、表面反光特性（镜面 / 哑光 / 磨砂 / 半透明）、结构细节、使用状态（全新 / 磨损 / 运动中）。\n场景作为主体时：建筑类型、空间尺度、关键地标或标志性元素。\n\n2. 动作\n精准描述主体动态的完整流程：起始姿态 → 运动过程 → 结束姿态。\n明确速度节奏（匀速 / 加速 / 减速 / 骤停）与力度变化。\n细化手部动作（手指姿态、抓握方式、手势含义）、重心转移轨迹、身体朝向变化。\n微表情：眉毛、眼睛、嘴角的细微变化与时间节点。\n视线方向：看镜头 / 看画外 / 追踪某物 / 低垂 / 上扬。\n多镜头时说明：入镜方式（从画面哪侧 / 如何出现）→ 画面内停留与移动 → 出镜方式。\n\n3. 场景\n明确环境背景与空间结构。\n室内：房间类型、建筑风格（现代 / 工业 / 中式 / 北欧 / 巴洛克）、空间布局、家具陈设、墙面材质与颜色。\n室外：地形地貌、植被类型、天际线、街道或自然环境特征。\n前景 / 中景 / 背景的层次关系与纵深感。\n时间（清晨 / 正午 / 黄昏 / 深夜）、季节、天气（晴 / 阴 / 雨 / 雪 / 雾 / 风）。\n整体氛围关键词（宁静 / 紧张 / 梦幻 / 压迫 / 温馨 / 荒凉）。\n\n4. 光影\n指定光线的完整参数。\n光线类型：自然光 / 人工光 / 混合光；硬光 / 柔光 / 漫射光。\n光源方向：正面光 / 侧光 / 逆光 / 顶光 / 底光 / 伦勃朗光 / 蝴蝶光。\n光线强度与柔硬度（硬边阴影 vs 渐变过渡）。\n光影对主体的具体影响：面部明暗分割线位置、轮廓高光形状、投射阴影范围与方向、眼神光形状。\n反射与折射效果（地面反光、水面倒影、玻璃折射）。\n整体色温（暖黄 / 冷蓝 / 中性白）与色温变化趋势。\n\n5. 运镜\n说明镜头的完整运动信息。\n景别：大远景 / 远景 / 全景 / 中景 / 中近景 / 近景 / 特写 / 大特写。\n焦段感受：广角畸变感 / 标准透视 / 长焦压缩感。\n构图方式：三分法 / 中心构图 / 对称 / 黄金螺旋 / 引导线 / 框架构图。\n镜头运动轨迹：推 / 拉 / 摇 / 移 / 跟拍 / 环绕 / 升降 / 俯拍 / 仰拍 / 手持晃动 / 斯坦尼康稳定。\n运动速度与节奏（匀速 / 渐快 / 渐慢 / 突然变速）。\n景深控制：大光圈浅景深虚化 / 小光圈全景深 / 焦点转移（从前景到背景）。\n屏幕比例：16:9 / 9:16 / 2.39:1 / 1:1。\n多镜头时标明切换逻辑（硬切 / 叠化 / 闪白 / 遮罩转场）与时序关系。\n\n6. 风格\n定义整体视觉风格与美学调性。\n影像风格：电影感 / 纪录片 / 广告大片 / MV / Vlog / 赛博朋克 / 复古胶片 / 日系清新 / 暗黑哥特 / 极简主义。\n色彩风格：高饱和 / 低饱和 / 单色调 / 互补色 / 类比色 / 莫兰迪色系 / 霓虹色系。\n调色方向：暗部偏青还是偏紫、高光偏暖还是偏冷、中间调倾向。\n画面质感：胶片颗粒 / 数码锐利 / 柔焦梦幻 / 高对比硬朗 / 低对比朦胧。\n确保人物、场景与光影风格三者统一。\n\n7. 画质\n明确技术参数与质量约束。\n分辨率：4K / 8K / 1080p。\n帧率：24fps 电影感 / 30fps 标准 / 60fps 丝滑 / 120fps 慢动作。\n画面质量约束：高细节渲染、抗锯齿、无噪点、无模糊、无畸变、无比例错误、动作自然流畅、皮肤质感真实。",c:"反推提示词"},{n:65,t:"视频反推·完整专业版",s:"逐镜头18维拆解+成品提示词+负面防崩清单",p:"请全面化身为顶级 AI 视频提示词架构师、电影级镜头语言分析师与多模态视频逆向工程师。\n\n不要只总结视频内容。请严格按照时间顺序，逐镜头完成以下全部拆解：\n\n第一步：逐镜头时间轴拆解\n对视频中的每一个镜头，按时间顺序逐一输出以下全部维度，每个镜头必须包含的 18 个维度：\n① 镜头编号与时间码：用 Shot 01 [00:00–00:03] 格式标注。\n② 主体身份与外观锚点：人物的年龄 / 性别 / 种族 / 体态 / 发型 / 妆容 / 服装 / 配饰 / 情绪，或物品的完整视觉描述。\n③ 动作轨迹：起始姿态 → 运动过程 → 结束姿态，含手部细节、重心变化、力度节奏。\n④ 微表情与视线：眉毛 / 眼睛 / 嘴角变化的具体时间节点，视线方向与变化。\n⑤ 场景空间：室内外类型、建筑风格、空间布局、关键陈设。\n⑥ 前中后景关系：前景元素 → 中景主体 → 背景环境的层次与纵深。\n⑦ 景别：大远景 / 远景 / 全景 / 中景 / 中近景 / 近景 / 特写 / 大特写。\n⑧ 机位高度与角度：平视 / 俯拍 / 仰拍 / 荷兰角 / 鸟瞰 / 虫眼视角，机位距主体距离。\n⑨ 焦段感受：广角（畸变 / 空间延伸）/ 标准 / 长焦（压缩 / 背景虚化）。\n⑩ 构图：三分法 / 中心 / 对称 / 黄金比例 / 引导线 / 框架 / 对角线构图。\n⑪ 景深：浅景深（虚化程度与范围）/ 深景深 / 焦点转移方向。\n⑫ 运镜方式与速度：推 / 拉 / 摇 / 移 / 跟拍 / 环绕 / 升降 / 手持 / 斯坦尼康，匀速 / 加速 / 减速 / 骤停。\n⑬ 光线方向与类型：光源方向、硬光 / 柔光、自然光 / 人工光、光比。\n⑭ 综合色温与调色：暖 / 冷 / 中性，暗部色调倾向，高光色调倾向。\n⑮ 材质与质感：画面中关键材质的视觉表现（金属反光 / 织物纹理 / 皮肤质感 / 液体流动）。\n⑯ 节奏：本镜头的时间长度、动作节奏、剪辑节奏感（快 / 慢 / 停顿 / 呼吸感）。\n⑰ 转场：与下一镜头的衔接方式（硬切 / 叠化 / 闪白 / 遮罩 / 运动匹配 / 声音桥接）。\n⑱ 环境声音与音效：环境底噪、关键音效、音乐节奏与画面的配合关系。\n\n第二步：输出成品生成提示词\n基于上述拆解，反推出一套适用于【目标视频模型（如 Sora / Kling / Runway / Vidu / 可灵 / Pika，请指定）】的成品生成提示词。每个镜头分别标注：1. 起始画面：镜头第一帧的完整视觉描述；2. 人物动作：主体在本镜头内的完整动态过程；3. 摄影机运动：镜头运动的完整轨迹与速度；4. 结束画面：镜头最后一帧的完整视觉描述；5. 镜头衔接：与下一镜头的视觉 / 动作 / 情绪连接方式。\n\n第三步：输出负面提示词（防崩指令），必须覆盖以下全部类别：\n人物一致性防崩：禁止人物变脸、肤色不一致、发型突变、服装漂移、配饰消失或变形。\n肢体与动作防崩：禁止多余或缺少手指、手指融合穿模、关节反向弯曲、肢体比例失真、动作断裂、肢体穿透、悬浮。\n面部与表情防崩：禁止面部扭曲五官位移、牙齿异常、眼睛异常、表情僵硬或与情境不匹配、嘴型与语音不同步。\n场景与物理防崩：禁止背景闪烁、背景元素漂移、物理关系失真（悬浮 / 阴影矛盾 / 反射不合理 / 重力异常）、透视错误、比例失真、材质突变。\n画面质量防崩：禁止模糊失焦、噪点色带、画面撕裂闪烁、水印文字伪影乱码、分辨率不一致。\n运镜与时间防崩：禁止运镜突然跳变、时间流速异常、镜头间光线方向矛盾、镜头间色温突变。\n\n第四步：核心原则声明：只学习镜头逻辑和视觉方法，不照抄人物、品牌、台词和具体故事；输出的提示词是对视觉语法的提取，不是对原视频内容的复制。\n\n附按视频类型追加的专项要求：人物/剧情类（情绪弧线、人物空间关系、正反打机位、表演节奏）；产品/广告类（产品展示角度光线材质Logo、交互方式、节奏信息密度、文字元素时机）；风景/旅行类（大气透视、自然光时间变化、环境声音层次、运镜地形配合）；音乐/MV类（剪辑踩拍、视觉节奏段落对应、色彩情绪对应、特效音乐同步）；美食/手工/教程类（俯拍构图布局、特写触发逻辑、手部动作精确描述、材质变化过程）。\n\n输出格式：视频概览（总时长/总镜头数/整体风格/主要色调/目标生成模型）→ 镜头时间轴（每镜头：景别/机位/构图/主体描述/动作轨迹/微表情视线/场景空间/前中后景/焦段景深/运镜/光线/色温调色/材质质感/节奏/环境音/转场）→ 成品生成提示词（每镜头：起始画面/人物动作/摄影机运动/结束画面/镜头衔接/完整提示词）→ 负面提示词清单 → 全局风格锚定（视觉风格/色彩体系/画面质感/分辨率帧率/画质约束）。",c:"反推提示词"},{n:66,t:"图片反推·通用版",s:"任何图片都能用，中英双语拆解",p:"详细反推这张图片的完整提示词，包含主体、风格、色彩、光影、构图、质感、分辨率和细节描述。分析这张图片的视觉元素、色调、氛围、技法和关键词，生成可直接用于 AI 绘图的精准 prompt。请用中英双语详细描述图片内容，拆解风格、光线、材质、镜头和配色。",c:"反推提示词"},{n:67,t:"图片反推·字体/Logo/文字设计",s:"反推字体风格与 Logo 特效",p:"反推这款字体的风格、字形特征、笔画质感、配色、排版和特效，生成字体设计提示词。详细描述字体：风格（现代 / 复古 / 赛博 / 手写）、粗细、衬线 / 无衬线、倒角、立体效果、光泽，以及金属 / 磨砂 / 玻璃质感。分析 Logo 的配色方案、构图比例、光影、材质和特效（描边、发光、渐变、浮雕），输出可复制提示词。",c:"反推提示词"},{n:68,t:"图片反推·风景类",s:"自然风景/城市风景/场景反推",p:"反推这张风景图的环境、天气、时间、光线、色调、氛围、构图和景深，生成风景提示词。详细描述：场景主体、季节、时段（清晨 / 黄昏 / 夜晚）、天空、云层、植被、水体、色调、氛围感和镜头感。提取关键词：风格、色彩、光影、画质、分辨率、氛围、透视和细节质感。",c:"反推提示词"},{n:69,t:"图片反推·摄影类",s:"真人/人像/产品/纪实摄影反推",p:"反推这张摄影图的相机参数、镜头、光影、色调、画质、构图和氛围，生成摄影风格 prompt。详细描述：光线（自然光 / 硬光 / 柔光 / 逆光）、景深、焦距、画质（8K / 高清 / 胶片）、色调（冷色 / 暖色 / 复古 / 胶片感）和构图。提取：摄影师风格、光影、质感、分辨率、对焦、噪点、锐度和情绪氛围。",c:"反推提示词"},{n:70,t:"图片反推·插画类",s:"扁平/二次元/治愈/手绘插画反推",p:"反推这张插画的绘画风格、笔触、肌理、色彩、线条、构图、氛围和画师风格。详细描述：手绘 / 板绘、平涂 / 厚涂、赛璐璐 / 二次元 / 治愈系 / 国风、线条粗细、色彩搭配、质感和细节。生成可直接用于 AI 绘画的插画关键词，包含技法、色彩、主题和氛围。",c:"反推提示词"},{n:71,t:"图片反推·3D类",s:"C4D/Blender/3D 渲染反推",p:"反推这张 3D 图的渲染风格、材质、灯光、建模风格、精度、配色、质感，以及 C4D / Blender 特征。详细描述：3D 卡通 / 写实 / 黏土 / 磨砂 / 金属 / 玻璃 / 亚克力、光影（三点布光）、反射、粗糙度、Octane 渲染、软边缘和体积光。提取关键词：3D render、C4D、Blender、Octane、PBR 材质、柔光、高细节、8K、卡通质感、极简。",c:"反推提示词"},{n:72,t:"图片反推·IP角色类",s:"潮玩/Q版/盲盒 IP 角色反推",p:"反推这个 IP 角色的形象设定、风格类型、五官表情、体型比例、服饰、配色、材质、光影和细节特征，生成同款 IP 角色提示词。详细描述：风格（Q 版 / 潮玩 / 治愈 / 国风 / 黏土 / 卡通）、头身比、发型、服饰装饰、神态、动作姿态，以及材质（哑光 / 树脂 / PVC / 陶瓷）和质感。提取关键词：IP 角色、盲盒风格、潮玩、C4D、3D 渲染、柔光、纯色背景、细腻质感、高细节、可爱、治愈、极简、全身造型。",c:"反推提示词"}];
const PCATS=["AI 工具","UI","分析决策","反推提示词","开会","汇报总结","沟通写作","熟食店经营","网页","设计","质感"];
const DAILYTASKS=[["07:50","全球新闻速览","每天","汇总聊"],["08:00","盘前预判","交易日","汇总聊"],["08:00","热榜双榜","每天","汇总聊"],["08:50","Gmail安全汇总","每天","汇总聊"],["09:50","每日资讯APP同步","每天","后台静默"],["12:50","财富30讲","每天","书籍聊"],["20:30","持仓收益播报","交易日","资本家聊"],["20:50","每日英语","每天","英语聊"],["21:50","每日一书","每天","书籍聊"],["22:50","书籍自学","每天","后台静默"],["23:50","财富自学+备份","每天","主聊"],["全天","小说三线并行写作","每30分钟","后台持续"]];
function dayOfYear(){const n=new Date();return Math.floor((n-new Date(n.getFullYear(),0,0))/864e5)}
function todayCard(){return PROMPTS[dayOfYear()%PROMPTS.length]}
function nextTask(){const hm=String(new Date().getHours()).padStart(2,"0")+":"+String(new Date().getMinutes()).padStart(2,"0");for(const d of DAILYTASKS){if(d[0]!=="全天"&&d[0]>hm)return d}return null}
let _plCat="全部";
function plHTML(){return '<div class="fcard"><h3>📝 提示词库（'+PROMPTS.length+'条）</h3><input id="plQ" placeholder="🔍 搜索标题/场景/正文" oninput="renderPlList()"><div id="plCats" style="margin:6px 0">'+["全部"].concat(PCATS).map((c,i)=>'<button class="ghost" data-c="'+c+'" style="margin:0 4px 6px 0;'+(i===0?"border-color:var(--acc);color:var(--acc)":"")+'" onclick="plCat(this)">'+c+'</button>').join("")+'</div><div id="plList"></div></div><div class="note">库来自你教我的提示词（72条存档版）。以后你教的新提示词，我会在下次更新时并入，首页每日一卡也会轮到它们。</div>'}
function plCat(b){_plCat=b.dataset.c;document.querySelectorAll("#plCats .ghost").forEach(x=>{x.style.borderColor="";x.style.color=""});b.style.borderColor="var(--acc)";b.style.color="var(--acc)";renderPlList()}
function renderPlList(){const q=(document.getElementById("plQ").value||"").toLowerCase();const list=PROMPTS.map((p,i)=>({p:p,i:i})).filter(x=>_plCat==="全部"||x.p.c===_plCat).filter(x=>!q||(x.p.t+x.p.s+x.p.p).toLowerCase().indexOf(q)>=0);document.getElementById("plList").innerHTML=list.slice(0,80).map(x=>'<div class="item"><b>'+x.p.n+'. '+esc(x.p.t)+'</b> <span class="stag p-mid">'+esc(x.p.c)+'</span><p>'+esc(x.p.s)+'</p><div class="row"><button class="ghost" onclick="plView('+x.i+')">查看全文</button><button class="ghost" onclick="plCopy('+x.i+')">复制</button></div><div id="plv'+x.i+'" style="display:none"><p style="white-space:pre-wrap;margin-top:6px;line-height:1.7">'+esc(x.p.p)+'</p></div></div>').join("")||'<div class="empty">无匹配</div>'}
function plView(i){const e=document.getElementById("plv"+i);e.style.display=e.style.display==="none"?"block":"none"}
function plCopy(i){const t=PROMPTS[i].p;const done=function(){alert("已复制："+PROMPTS[i].t)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(function(){alert("复制失败，长按手动复制")});else alert(t)}
function dailyHTML(){const nt=nextTask();return '<div class="card"><h4>📅 今日任务表（'+DAILYTASKS.length+'项）</h4><div style="font-size:10px;color:var(--dim);margin-bottom:8px">按计划时间排列，实际以聊天里收到推送为准</div>'+DAILYTASKS.map(d=>{const isNext=nt&&d[0]===nt[0]&&d[1]===nt[1];return '<div class="kv"><span>⏰ '+d[0]+' · '+d[1]+' <span style="color:var(--dim)">('+d[2]+')</span>'+(isNext?' <span class="stag p-hi">下一项</span>':"")+'</span><b>'+d[3]+'</b></div>'}).join("")+'</div><div class="note">交易日任务（盘前预判、持仓播报）周末节假日不跑。想调整时间或增删任务，在聊天里跟我说。</div>'}
function homeTodayHTML(){const c=todayCard();const d=new Date();const wd="日一二三四五六"[d.getDay()];const nt=nextTask();return '<div class="card"><h4>📅 今日 · '+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wd+'</h4><div class="kv"><span>💡 每日一卡</span><b style="cursor:pointer;color:var(--acc)" onclick="goSec(\'pl\')">去提示词库 →</b></div><p style="font-size:12px;margin:6px 0"><b>'+c.n+'. '+esc(c.t)+'</b><br><span style="color:var(--sub)">'+esc(c.s)+'</span></p><div class="kv"><span>📅 今日任务</span><b>'+DAILYTASKS.length+'项'+(nt?' · 下一项 '+nt[0]+' '+nt[1]:' · 今日已结束')+'</b></div><div style="font-size:10px;color:var(--dim)">每天零点自动换新卡片、刷新任务表，不用联网、不用等推送</div></div>'}
buildRail();render();
</script>
