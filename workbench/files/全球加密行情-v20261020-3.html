/* ========= 格式化 ========= */
function fmtPrice(v){
  if(v==null||isNaN(v)) return '—';
  if(v>=1000) return '$'+v.toLocaleString('en-US',{maximumFractionDigits:2});
  if(v>=1) return '$'+v.toFixed(2);
  if(v>=0.01) return '$'+v.toFixed(4);
  return '$'+v.toPrecision(3);
}
function fmtPct(v){
  if(v==null||isNaN(v)) return '—';
  return (v>0?'+':'')+v.toFixed(2)+'%';
}
function pctCls(v){ return (v==null||isNaN(v))?'':(v>=0?'up':'dn'); }
function fmtCap(v){
  if(v==null||isNaN(v)) return '—';
  if(v>=1e12) return '$'+(v/1e12).toFixed(2)+'万亿';
  if(v>=1e8) return '$'+(v/1e8).toFixed(1)+'亿';
  if(v>=1e4) return '$'+(v/1e4).toFixed(1)+'万';
  return '$'+v.toFixed(0);
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
async function jget(url, timeout){
  var ctl = new AbortController(); var t = setTimeout(function(){ctl.abort()}, timeout||12000);
  try{ var r = await fetch(url, {signal: ctl.signal}); clearTimeout(t); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ clearTimeout(t); return null; }
}
async function tget(url, timeout){
  var ctl = new AbortController(); var t = setTimeout(function(){ctl.abort()}, timeout||12000);
  try{ var r = await fetch(url, {signal: ctl.signal}); clearTimeout(t); if(!r.ok) throw 0; return await r.text(); }
  catch(e){ clearTimeout(t); return null; }
}

async function loadGlobal(){
  var g = await jget('https://api.coingecko.com/api/v3/global');
  if(g && g.data){
    var d = g.data;
    $('ovCap').textContent = fmtCap(d.total_market_cap && d.total_market_cap.usd);
    $('ovVol').textContent = fmtCap(d.total_volume && d.total_volume.usd);
    $('ovBtc').textContent = d.market_cap_percentage ? d.market_cap_percentage.btc.toFixed(1)+'%' : '—';
    var chg = d.market_cap_change_percentage_24h_usd;
    var el = $('ovChg'); el.textContent = fmtPct(chg); el.className = 'v '+pctCls(chg);
    globalOk = true;
    return true;
  }
  return false;
}
async function loadCoins(){
  var pages = await Promise.all([
    jget('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&price_change_percentage=24h,7d,30d'),
    jget('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=2&price_change_percentage=24h,7d,30d')
  ]);
  var all = [];
  if(Array.isArray(pages[0])) all = all.concat(pages[0]);
  if(Array.isArray(pages[1])) all = all.concat(pages[1]);
  if(all.length){ coins = all; coinOk = true; return true; }
  return false;
}

      var key = String(r.f12).toUpperCase();

    var syms = missing.map(function(s){return s.tk}).join('|');

      arr.forEach(function(r){
        quotes[String(r.symbol).toUpperCase()] = {
          price: parseFloat(r.last), pct: parseFloat(String(r.change_pct||'').replace('%','')),
          chg: parseFloat(r.change), high: parseFloat(r.high), low: parseFloat(r.low), open: parseFloat(r.open),
          prev: parseFloat(r.previous_day_closing), src: 'CNBC'
        };
      });
    }
  }
  if(Object.keys(quotes).length) stockOk = true;
  return got;
}
async function refreshAll(){ await Promise.all([refreshFast(), refreshCoins()]); }
async function refreshFast(){
  var r = await Promise.all([loadGlobal(), loadStocks()]);
  if(r[0] || r[1]){ stampSync(); saveCache(); }
  else {
    $('mktState').textContent = (coinOk || stockOk) ? '网络慢 · 显示上次数据' : '同步失败';
    if(!coinOk && !stockOk && !globalOk) $('netWarn').style.display = 'block';
  }
  if(tab === 'stock') render();
}
async function refreshCoins(){
  var ok = await loadCoins();
  if(ok){ stampSync(); saveCache(); }
  if(tab === 'coin') render();
}
function manualRefresh(){ $('mktState').textContent = '同步中…'; refreshAll(); }
function stampSync(){
  var now = new Date();
  $('syncTime').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  $('mktState').textContent = (coinOk||stockOk) ? '已同步' : '同步失败';
  if(!coinOk && !stockOk && !globalOk) $('netWarn').style.display = 'block';
}
/* ========= 本地快照：打开先显示上次数据，不再干等 ========= */
var CK = 'hema-crypto-v3';
function saveCache(){
  if(!coins.length && !Object.keys(quotes).length) return;
  try{
    var slim = coins.map(function(c){ return {id:c.id, symbol:c.symbol, name:c.name, image:c.image, current_price:c.current_price, market_cap:c.market_cap, market_cap_rank:c.market_cap_rank, total_volume:c.total_volume, high_24h:c.high_24h, low_24h:c.low_24h, price_change_percentage_24h:c.price_change_percentage_24h, price_change_percentage_7d_in_currency:c.price_change_percentage_7d_in_currency, price_change_percentage_30d_in_currency:c.price_change_percentage_30d_in_currency, ath:c.ath, ath_date:c.ath_date, circulating_supply:c.circulating_supply}; });
    localStorage.setItem(CK, JSON.stringify({t:Date.now(), coins:slim, quotes:quotes, ov:{cap:$('ovCap').textContent, vol:$('ovVol').textContent, btc:$('ovBtc').textContent, chg:$('ovChg').textContent, cls:$('ovChg').className}}));
  }catch(e){}
}
function loadCache(){
  try{
    var s = JSON.parse(localStorage.getItem(CK) || 'null');
    if(!s) return false;
    if(Array.isArray(s.coins) && s.coins.length){ coins = s.coins; coinOk = true; }
    if(s.quotes && Object.keys(s.quotes).length){ quotes = s.quotes; stockOk = true; }
    if(s.ov && s.ov.cap && s.ov.cap !== '—'){
      $('ovCap').textContent = s.ov.cap; $('ovVol').textContent = s.ov.vol; $('ovBtc').textContent = s.ov.btc;
      var el = $('ovChg'); el.textContent = s.ov.chg; el.className = s.ov.cls; globalOk = true;
    }
    if(s.t){
      var d = new Date(s.t);
      $('syncTime').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'（上次）';
    }
    return !!(coins.length || stockOk);
  }catch(e){ return false; }
}

/* ========= 列表渲染 ========= */
function switchTab(t){
  tab = t;
  $('tabCoin').className = t==='coin' ? 'on' : '';
  $('tabStock').className = t==='stock' ? 'on' : '';
  $('sortChips').style.display = t==='coin' ? 'flex' : 'none';
  render();
}
function setSort(m){
  sortMode = m;
  var bs = document.querySelectorAll('#sortChips button');
  bs.forEach(function(b){ b.className = b.getAttribute('data-s')===m ? 'on' : ''; });
  render();
}
function qmatch(s){ return s.toLowerCase().indexOf($('q').value.trim().toLowerCase()) >= 0; }
function render(){
  var w = $('listWrap');
  if(tab === 'coin'){
    if(!coins.length){ w.innerHTML = '<div class="loading">'+(coinOk?'暂无数据':'正在同步全球行情…')+'</div>'; return; }
    var arr = coins.slice();
    if(sortMode === 'up') arr.sort(function(a,b){return (b.price_change_percentage_24h||-999)-(a.price_change_percentage_24h||-999)});
    if(sortMode === 'dn') arr.sort(function(a,b){return (a.price_change_percentage_24h||999)-(b.price_change_percentage_24h||999)});
    arr = arr.filter(function(c){ return qmatch(c.name+' '+c.symbol+' '+zhn(c)); });
    if(!arr.length){ w.innerHTML = '<div class="loading">没搜到这个币</div>'; return; }
    w.innerHTML = '<div class="secttl">全球市值前 200 · 美元计价</div>' + arr.map(function(c){
      return '<div class="row" onclick="openCoin(\''+c.id+'\')">'
        + '<span class="rank">'+(c.market_cap_rank||'')+'</span>'
        + '<img loading="lazy" src="'+c.image+'" alt="" onerror="this.style.visibility=\'hidden\'">'
        + '<div class="mid"><div class="nm">'+(zhn(c)||c.name)+'</div><div class="sm">'+String(c.symbol).toUpperCase()+(zhn(c)?' · '+c.name:'')+' · '+fmtCap(c.market_cap)+'</div></div>'
        + '<div class="right"><div class="pr">'+fmtPrice(c.current_price)+'</div></div>'
        + '<div class="pcts"><span class="pct '+pctCls(c.price_change_percentage_24h)+'"><small>24h</small>'+fmtPct(c.price_change_percentage_24h)+'</span>'
        + '<span class="pct '+pctCls(c.price_change_percentage_7d_in_currency)+'"><small>7天</small>'+fmtPct(c.price_change_percentage_7d_in_currency)+'</span></div>'
        + '</div>';
    }).join('');
  } else {
    var arr2 = STOCKS.filter(function(s){ return qmatch(s.cn+' '+s.en+' '+s.tk); });
    if(!arr2.length){ w.innerHTML = '<div class="loading">没搜到这家公司</div>'; return; }
    w.innerHTML = '<div class="secttl">加密相关上市公司 · 美股 + 港股主要标的</div>' + arr2.map(function(s){
      var qt = quotes[s.tk.toUpperCase()] || quotes[parseInt(s.tk,10)+'' ] || null;
      var pr = qt ? (s.cur + (qt.price>=100? qt.price.toLocaleString('en-US',{maximumFractionDigits:2}) : qt.price)) : '—';
      var pc = qt ? '<span class="pct '+pctCls(qt.pct)+'"><small>今日</small>'+fmtPct(qt.pct)+'</span>' : '<span class="pct"><small>今日</small>—</span>';
      return '<div class="row" onclick="openStock(\''+s.tk+'\')">'
        + '<span class="tk">'+s.tk+'</span>'
        + '<div class="mid"><div class="nm">'+s.cn+'</div><div class="sm">'+s.tag+'</div></div>'
        + '<div class="right"><div class="pr">'+pr+'</div></div>'
        + '<div class="pcts">'+pc+'</div></div>';
    }).join('');
  }
}

/* ========= 详情 ========= */
function openSheetCommon(title){
  $('sheet').style.display = 'block';
  $('dTitle').textContent = title;
  window.scrollTo(0,0);
  $('sheet').scrollTop = 0;
}
function closeSheet(){ $('sheet').style.display = 'none'; curDetail = null; }
function markRange(days){
  var bs = document.querySelectorAll('#dRanges button');
  bs.forEach(function(b){ b.className = parseInt(b.getAttribute('data-d'),10)===days ? 'on' : ''; });
}
function setRanges(el, ranges, cur, cbName){
  el.innerHTML = ranges.map(function(r){
    return '<button data-d="'+r+'" class="'+(r===cur?'on':'')+'" onclick="'+cbName+'('+r+')">'+(r===0?'发行以来':r+'天')+'</button>';
  }).join('');
}
function drawChart(points){
  if(points && points.length > 600){
    var step = Math.ceil(points.length/600), np = [];
    for(var di = 0; di < points.length; di += step) np.push(points[di]);
    if(np[np.length-1] !== points[points.length-1]) np.push(points[points.length-1]);
    points = np;
  }
  var cv = $('dChart');
  var W = cv.clientWidth || 360, H = 200, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H+'px';
  var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if(!points || points.length < 2){ $('cFrom').textContent = '历史数据暂不可用'; $('cMid').textContent=''; $('cTo').textContent=''; return null; }
  var vals = points.map(function(p){return p[1]});
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var pad = (mx - mn) * 0.08 || mx * 0.02 || 1; mn -= pad; mx += pad;
  var px = function(i){ return 8 + (W-16) * i / (points.length - 1); };
  var py = function(v){ return 10 + (H-30) * (1 - (v - mn) / (mx - mn)); };
  var up = vals[vals.length-1] >= vals[0];
  var col = up ? '#FF6B6B' : '#35D07F';
  var grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, up ? 'rgba(255,107,107,.35)' : 'rgba(53,208,127,.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  points.forEach(function(p, i){ var x = px(i), y = py(p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  ctx.lineTo(px(points.length-1), H-10); ctx.lineTo(px(0), H-10); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.fillStyle = '#7E93B0'; ctx.font = '10px sans-serif';
  ctx.fillText(fmtPrice(mx - pad), 10, 16);
  ctx.fillText(fmtPrice(mn + pad), 10, H - 22);
  $('cFrom').textContent = fmtDate(points[0][0]);
  var chg = (vals[vals.length-1]/vals[0]-1)*100;
  $('cMid').innerHTML = '期间 <span class="'+pctCls(chg)+'">'+fmtPct(chg)+'</span> · 高 '+fmtPrice(Math.max.apply(null, vals))+' · 低 '+fmtPrice(Math.min.apply(null, vals));
  $('cTo').textContent = fmtDate(points[points.length-1][0]);
  return chg;
}

/* ---- 币详情 ---- */
async function openCoin(id){
  var c = null;
  coins.forEach(function(x){ if(x.id===id) c = x; });
  if(!c) return;
  curDetail = {type:'coin', id:id, sym:String(c.symbol).toUpperCase()};
  openSheetCommon((zhn(c)? zhn(c)+' · ':'') + c.name + ' (' + String(c.symbol).toUpperCase() + ')');
  $('dPrice').textContent = fmtPrice(c.current_price);
  var p = $('dPct'); p.textContent = '24h ' + fmtPct(c.price_change_percentage_24h); p.className = 'dpct ' + pctCls(c.price_change_percentage_24h);
  setRanges($('dRanges'), [7,30,90,365,0], 30, 'coinRange');
  setKv([
    ['市值排名', '#'+(c.market_cap_rank||'—')],
    ['市值', fmtCap(c.market_cap)],
    ['24h 成交量', fmtCap(c.total_volume)],
    ['24h 最高 / 最低', fmtPrice(c.high_24h)+' / '+fmtPrice(c.low_24h)],
    ['7天涨跌', fmtPct(c.price_change_percentage_7d_in_currency)],
    ['30天涨跌', fmtPct(c.price_change_percentage_30d_in_currency)],
    ['流通量', c.circulating_supply ? Math.round(c.circulating_supply).toLocaleString('en-US') : '—'],
    ['历史最高', fmtPrice(c.ath)+'（'+(c.ath_date?String(c.ath_date).slice(0,10):'')+'）']
  ]);
  drawChart(null);
  coinRange(30);
}
async function coinRange(days){
  if(!curDetail || curDetail.type!=='coin') return;
  if(days === 0){ markRange(0); loadCoinFull(); return; }
  markRange(days);
  $('cFrom').textContent = '加载历史中…'; $('cMid').textContent=''; $('cTo').textContent='';
  var url = 'https://api.coingecko.com/api/v3/coins/'+curDetail.id+'/market_chart?vs_currency=usd&days='+days+(days>=30?'&interval=daily':'');
  var d = await jget(url, 15000);
  if(d && Array.isArray(d.prices) && d.prices.length){
    var pts = d.prices;
    if(pts.length > 400){ var step = Math.ceil(pts.length/400); pts = pts.filter(function(_,i){return i%step===0 || i===d.prices.length-1}); }
    drawChart(pts);
  } else {
    drawChart(null);
  }
}


/* ---- 币：发行以来全历史 ---- */
async function loadCoinFull(){
  var id = curDetail.id;
  $('cFrom').textContent = '加载发行以来全历史…'; $('cMid').textContent=''; $('cTo').textContent='';
  var pts = null;
  if(id === 'bitcoin'){
    var bc = await jget('https://api.blockchain.info/charts/market-price?timespan=all&format=json&sampled=true', 20000);
    if(bc && Array.isArray(bc.values)){
      pts = bc.values.filter(function(v){return v.y > 0}).map(function(v){ return [v.x*1000, v.y]; });
      if(!pts.length) pts = null;
    }
  }
  var skipB = {'tether':1,'usd-coin':1,'dai':1,'first-digital-usd':1,'ethena-usde':1,'paypal-usd':1,'true-usd':1,'frax':1,'usdd':1,'staked-ether':1,'wrapped-bitcoin':1,'wrapped-eeth':1,'coinbase-wrapped-btc':1,'mantle-staked-ether':1};
  if(!pts && !skipB[id]){
    var pair = curDetail.sym + 'USDT';
    var start = 0, out = [];
    for(var i = 0; i < 8; i++){
      var rows = await jget('https://data-api.binance.vision/api/v3/klines?symbol='+pair+'&interval=1d&startTime='+start+'&limit=1000', 15000);
      if(!Array.isArray(rows) || !rows.length) break;
      rows.forEach(function(r){ out.push([r[0], parseFloat(r[4])]); });
      if(rows.length < 1000) break;
      start = rows[rows.length-1][0] + 86400000;
    }
    if(out.length > 10) pts = out;
  }
  if(!pts){
    var d = await jget('https://api.coingecko.com/api/v3/coins/'+id+'/market_chart?vs_currency=usd&days=365&interval=daily', 15000);
    if(d && Array.isArray(d.prices) && d.prices.length) pts = d.prices;
  }
  if(!curDetail || curDetail.type !== 'coin' || curDetail.id !== id) return;
  drawChart(pts);
}

/* ---- 股票详情 ---- */
async function openStock(tk){
  var s = null;
  STOCKS.forEach(function(x){ if(x.tk===tk) s = x; });
  if(!s) return;
  curDetail = {type:'stock', tk:tk, secid:s.secid, cur:s.cur, hist:null};
  openSheetCommon(s.cn + ' · ' + s.tk);
  var qt = quotes[tk.toUpperCase()] || quotes[parseInt(tk,10)+''] || null;
  if(qt){
    $('dPrice').textContent = s.cur + qt.price;
    var pe = $('dPct'); pe.textContent = '今日 ' + fmtPct(qt.pct) + (qt.chg!=null ? '（'+(qt.chg>0?'+':'')+qt.chg+'）' : ''); pe.className = 'dpct ' + pctCls(qt.pct);
    setKv([
      ['今日开盘', qt.open!=null? s.cur+qt.open : '—'],
      ['今日最高', qt.high!=null? s.cur+qt.high : '—'],
      ['今日最低', qt.low!=null? s.cur+qt.low : '—'],
      ['昨日收盘', qt.prev!=null? s.cur+qt.prev : '—'],
      ['数据来源', qt.src || '—'],
      ['类型', s.tag]
    ]);
  } else {
    $('dPrice').textContent = '—';
    $('dPct').textContent = '行情暂不可用';
    setKv([['类型', s.tag]]);
  }
  setRanges($('dRanges'), [30,90,180,365,0], 90, 'stockRange');
  drawChart(null);
  stockRange(90);
}
async function stockRange(days){
  if(!curDetail || curDetail.type!=='stock') return;
  markRange(days);
  $('cFrom').textContent = '加载历史中…'; $('cMid').textContent=''; $('cTo').textContent='';
  if(!curDetail.hist){
    curDetail.hist = await fetchStockHist(curDetail);
  }
  var pts = curDetail.hist;
  if(pts && pts.length){
    var sel = days === 0 ? pts : pts.filter(function(p){ return p[0] >= Date.now() - days*24*3600*1000; });
    if(sel.length < 2) sel = pts.slice(-Math.min(pts.length, days));
    drawChart(sel);
  } else {
    drawChart(null);
  }
}
async function fetchStockHist(det){
  /* 一：东方财富 K 线 */
  var em = await jget('https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+det.secid+'&fields1=f1&fields2=f51,f53&klt=101&fqt=1&beg=19900101&end=20500101', 9000);
  if(em && em.data && Array.isArray(em.data.klines) && em.data.klines.length){
    return em.data.klines.map(function(line){
      var a = line.split(',');
      return [ new Date(a[0]).getTime(), parseFloat(a[1]) ];
    }).filter(function(p){ return !isNaN(p[1]); });
  }
  /* 二：Nasdaq 历史（仅美股） */
  if(det.cur === '$'){
    var fs = '1980-01-01';
    var nd = await jget('https://api.nasdaq.com/api/quote/'+det.tk+'/historical?assetclass=stocks&fromdate='+fs+'&limit=9999', 12000);
    var rows = nd && nd.data && nd.data.tradesTable && nd.data.tradesTable.rows;
    if(Array.isArray(rows) && rows.length){
      return rows.map(function(r){
        return [ new Date(r.date).getTime(), parseFloat(String(r.close).replace(/[$,]/g,'')) ];
      }).filter(function(p){ return !isNaN(p[1]); }).reverse();
    }
  }
  return null;
}
function setKv(rows){
  $('dKv').innerHTML = rows.map(function(r){return '<span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span>'}).join('');
}

/* ========= 启动 ========= */
if(loadCache()){ render(); $('mktState').textContent = '显示上次数据 · 后台同步中'; }
refreshAll();
setInterval(refreshFast, 60000);
setInterval(refreshCoins, 180000);
