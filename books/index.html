egativa）是东西方对同一规律的两次发现：少犯错比多做对更能决定结局；与 080《失控》的自组织、涌现完全同源——\"无为而民自化\"就是两千年前的去中心化系统观；与下一本 087《庄子》是道家双璧：老子偏讲治事，庄子偏讲治心。"}, {"n": 87, "title": "庄子", "author": "庄子", "cat": "国学与哲学", "essence": "庄子教人在有限的人生里获得精神的绝对自由——看破大小贵贱的相对（齐物），顺应事物的天性做事（庖丁解牛），不被功名和潮流牵着走（逍遥）。", "points": ["齐物：大小、是非、贵贱都是相对视角的产物，\"天地与我并生，而万物与我为一\"——跳出单一的输赢框架，很多焦虑当场就消解了。", "顺天性者长久：庖丁解牛十九年刀刃如新，诀窍是\"依乎天理\"，顺着结构走、不硬砍；\"无用之用\"同理——大树因\"无用\"反而得以终其天年，不被利用、不卷入无谓竞争，本身就是大用。", "生命有限，欲望无限：\"吾生也有涯，而知也无涯。以有涯随无涯，殆已\"——把有限的时间耗在无限的焦虑和攀比上，是最亏本的活法。"], "concept": "逍遥（不受束缚的精神自由）；庖丁解牛（顺应结构规律的技艺之道）。", "extra_label": "经典案例", "extra": "庖丁为文惠君解牛，手之所触、肩之所倚、足之所履无不合于音律，十九年解牛数千头，刀刃却像刚从磨刀石上出来一样——因为他\"以神遇而不以目视，官知止而神欲行，依乎天理，批大郤，导大窾\"，顺着牛体天然的缝隙下刀，从不硬碰筋骨。文惠君听完感叹：\"吾闻庖丁之言，得养生焉。\"", "use": "这本书简直是给他量身的：他天天在切肉台上干活，庖丁解牛就是熟食手艺的最高描述——顺纹理、找缝隙、不硬剁，刀快、人不累、肉不碎；他做熟食流程表（下锅顺序、火候节奏）本质就是在摸清每样食材的那套\"天理\"，摸清了就又快又稳。心态层面：行情涨跌、流量起伏，用\"齐物\"看就没那么上头；店里、项目、战队再忙，也要给自己留一块\"无用\"的时间——那是长久续航的秘诀，不是浪费。", "link": "与 086《道德经》同源互补——老子讲怎么治事，庄子讲怎么治心。与 010《清单革命》形成有趣对照：清单是把经验外置成流程（新手靠它不犯错），庖丁是把流程内化成直觉（高手靠它出神入化）——手艺人先走清单、后长手感，两个阶段缺一不可；037《史记·老子韩非列传》附有庄子小传，是了解其生平的源头。"}, {"n": 88, "title": "孙子兵法", "author": "孙武", "cat": "国学与哲学", "essence": "兵法的最高境界不是百战百胜，而是\"先胜而后求战、不战而屈人之兵\"——先把自己立于不败之地，再等对手露出破绽。", "points": ["知己知彼，百战不殆：胜负在开打前的信息对比中就已注定大半——不知道自己的斤两、不摸对手的底牌，上场就是赌博，不是竞争。", "先胜后战：\"胜兵先胜而后求战，败兵先战而后求胜\"——先算清成本、地形、补给（胜算），再行动；冲动开战、指望临场翻盘的人必败。", "造势与避实击虚：不逐个硬拼，要造\"势\"（如转圆石于千仞之山），把力量集中在对手最弱、自己最强的点上；\"兵无常势，水无常形\"，打法随敌而变。"], "concept": "先胜（先为不可胜，立于不败之地）；势（结构性的、滚雪球般的优势）。", "extra_label": "经典金句", "extra": "\"知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。\"", "use": "一部现成的商战手册，直接映射三件事。①熟食店竞争——选址占地形、差异化单品是避实击虚（不跟大店拼全品类和价格）、成本核算先于扩张（先胜）；同行打价格战时不硬跟，守住老客和口碑就是自己的\"不败之地\"。②AI 变现项目——上架前先算清单价、平台抽成、交付成本，他的提示词包边际成本为零，等于开局就把\"胜\"算好了一半。③投资——定投本身就是\"先胜\"：不加杠杆、不 All in 单一板块、账户留足资金，先保证自己永不出局，再谈收益。", "link": "与 002《穷查理宝典》的逆向思考同构——芒格说\"先想清楚自己会死在哪儿\"，孙子说\"先为不可胜，以待敌之可胜\"，都是先排除失败、再等待胜利；037《史记·孙子吴起列传》记载了孙武以宫女练兵、吴宫教战的故事，是读本书的历史注脚；与 004《黑天鹅》的底线思维一致：先不败，再求胜。"}, {"n": 89, "title": "菜根谭", "author": "洪应明", "cat": "国学与哲学", "essence": "嚼得菜根，百事可做——一本把儒、释、道揉在一起的处世小书：做人留弹性、做事留余地、心态守平常，日子就能过得稳而长。", "points": ["宠辱不惊：得失荣辱都是外境，心不动才是主角——荣辱来了不飘、去了不怨，人生的主动权就始终在自己手里。", "圆融中有骨气：待人宽厚、给人留台阶（\"径路窄处，留一步与人行；滋味浓的，减三分让人尝\"），但修身要硬——\"立身要如青山不动，涉世要如流水无形\"，外圆内方。", "顺境防腐，逆境修德：\"居逆境中，周身皆针砭药石，砥节砺行而不觉\"——逆境是免费的磨刀石；顺境里\"眼前皆得意事\"时最易松懈，糖衣比苦药更腐蚀人。"], "concept": "宠辱不惊（心态的压舱石）；菜根精神（吃得了苦、耐得住烦、踏实做人做事）。", "extra_label": "经典金句", "extra": "\"宠辱不惊，闲看庭前花开花落；去留无意，漫随天外云卷云舒。\"", "use": "一本随身\"情绪稳定器\"。①投资心态——定投要拿得住，靠的不是技术分析而是心：涨了不狂加、跌了不割肉，宠辱不惊正是长持者最核心的心法。②经营日常——熟食店天天有琐事和难缠顾客，\"留一步与人行、减三分让人尝\"既是处世，也是实打实减少纠纷、留住回头客的生意经。③做项目——视频被否、页面被挑毛病，他一路靠把批评当\"针砭药石\"迭代到定版，这本书讲的就是这件事的原理版。", "link": "与 047《曾国藩家书》的修身传统一脉相承——都是在日常处世里安顿身心的功夫。与下一本 090《沉思录》构成东西方镜像：一个是明代文人的案头书，一个是罗马皇帝的军营笔记，相隔万里、相差千年，写的却是同一件事：管住自己的心。"}, {"n": 90, "title": "沉思录", "author": "马可·奥勒留", "cat": "国学与哲学", "essence": "罗马皇帝在边境军营写给自己看的斯多葛笔记：你能控制的只有自己的判断和行动，控制之外的一切（涨跌、评价、命运）学会接受，心就能立于不败之地。", "points": ["控制二分法：世事分两种——我能决定的（我的看法、欲望、行动）和我不能决定的（结果、他人、运气）；几乎所有痛苦，都来自动了心思去控制第二种。", "障碍即道路：\"阻碍行动的，反而促进行动；挡路的东西，成了路本身\"——把每次挫折翻译成训练材料，困境就由减分项变成加分项。", "活在当下、记得必死（memento mori）：人生短暂，别把时间耗在抱怨和揣测人心上；\"你可能在今天就离开人世，那就照此而行、而言、而思\"。"], "concept": "控制二分法（斯多葛的操练核心）；顺应自然（接受命运的安排，只经营自己的德性）。", "extra_label": "经典金句", "extra": "\"挡路的东西，成了路本身。\"（The impediment to action advances action. What stands in the way becomes the way.）", "use": "给他的三件大事配了一套\"心态操作系统\"。①投资——他能控制的只有定投纪律、仓位和账户留足资金，涨跌从来不归他管：盯着不能控制的东西焦虑，是每天看盘最大的内耗，这本书直接对症。②经营与做项目——视频被否、页面被嫌\"看不清\"，按\"障碍即道路\"处理：每条批评都是下一版的图纸——他实际上已经在这样做（v1 作废→v2 定版），这本书是他做法的理论版。③皇帝日理万机还在坚持写自我提醒，和他把原则、清单外置成\"开工自检台\"是同一招：好心态不是天生的，是写下来、反复看出来的。", "link": "与 003《原则》直接呼应——达利欧的\"痛苦＋反思＝进步\"就是斯多葛的现代管理学译本；与 089《菜根谭》构成东西双璧：一个修\"宠辱不惊\"，一个修\"控制二分\"，内核都是先安顿内心、再处理世界；回看 001《思考，快与慢》，斯多葛训练可以说就是两千年前对抗系统 1 的手工版系统 2。"}, {"n": 91, "title": "苏菲的世界", "author": "乔斯坦·贾德", "cat": "国学与哲学", "essence": "用一封封寄给 14 岁少女的哲学信，把两千五百年西方哲学史讲成一部悬疑小说——哲学不是背流派，而是恢复对世界发问的能力。", "points": ["哲学始于惊奇：人小时候个个对世界好奇，长大后被习惯麻痹；苏格拉底说\"我只知道我一无所知\"，保持惊奇是成为哲学家的唯一天赋要求。", "哲学史是一条问题链：从泰勒斯追问\"世界由什么构成\"，到柏拉图的理念世界、亚里士多德的经验分类、笛卡尔\"我思故我在\"、康德调和理性与经验——后人都是在回答前人的问题时把思想往前推了一步。", "存在之问没有标准答案：唯物、唯心、存在主义（萨特\"人注定自由\"）给出的是不同活法；哲学的产出不是结论，而是你选择用什么态度过这一生。"], "concept": "惊奇（哲学之源）；理念论 vs 经验论。", "extra_label": "经典金句", "extra": "\"整个宇宙好比魔术师从礼帽里拉出来的一只大白兔，我们都栖身在兔毛的深处，只有哲学家才努力沿着细毛往上爬，爬到毛尖上去直视魔术师的眼睛。\"", "use": "他白天守店、晚上折腾 AI，日子最容易被\"熟练\"麻痹，这本书就是解药：让\"为什么\"别死。他做收藏夹、学漫剧时多问一句\"这个东西为什么是这样、还能怎样\"，就是他和同行拉开差距的起点。也不必怕哲学\"没用\"：定投赚的本来就是认知的钱，认知的底层就是怎么看世界——这本是全书单给世界观打地基的一本，读完再回头看投资、成长类会更透。", "link": "《学会提问》（007）教提问的技术，这本是提问的源头活水——苏格拉底的诘问法就是淘金式思维的祖师爷；它和下一本尼采正好成一组对照：苏菲讲\"哲学教你看清世界\"，尼采喊\"旧世界观已死，你得自己创造\"。"}, {"n": 92, "title": "查拉图斯特拉如是说", "author": "尼采", "cat": "国学与哲学", "essence": "一部用圣经文体写成的\"反经\"——\"上帝已死\"之后，人不能再靠现成答案活着，必须超越自己，成为自己人生的立法者。", "points": ["上帝已死：不是一句亵渎，而是一个诊断——传统价值体系崩塌后，虚无主义和\"末人\"（只求舒服、眨着眼睛说\"我们发明了幸福\"的人）会来填补真空。", "超人不是超能力者，而是方向：人是\"架在禽兽与超人之间的一根绳索\"，价值在于不断自我超越；配套的是权力意志——生命的本质是扩张、创造、向上生长。", "精神三变：骆驼（负重前行、服从\"你应该\"）→ 狮子（反抗、喊出\"我要\"、打碎旧价值的巨龙）→ 孩童（忘却旧规则、天真地重新开始、说出神圣的\"是\"、创造新价值）——这是尼采给的人生进阶路线图。"], "concept": "超人（Übermensch）；永恒轮回（用\"这一生若要无限次重过，你愿意吗\"来检验自己的活法）。", "extra_label": "经典金句", "extra": "\"人是一根绳索，系在禽兽与超人之间——一根悬在深渊之上的绳索。\"", "use": "最对症的是\"末人\"警告——守着熟食店过安稳日子、刷手机到半夜，就是末人剧本；他下班后做漫剧、搭工作台、学 AI，其实正是在当那根往上够的\"绳索\"。精神三变也正好对应他的轨迹：骆驼期扛起店铺和家庭是本分，但不能一辈子只当骆驼；狮子期要敢砍掉不赚钱的品类和不合理的老习惯；孩童期是做出完全属于自己的新东西——他的 AI 项目就是。读尼采要防一个坑：别学成愤世嫉俗，\"超越\"是对自己下手，不是对别人摆谱。", "link": "塔勒布《反脆弱》（005）的精神源头就是尼采（\"杀不死我的，使我更强大\"正是尼采名言）——反脆弱说\"从冲击中获利\"，尼采更早就说了同一件事；但它和《原则》（003）是两种进化路线：达利欧靠系统和流程进化，尼采靠意志和创造进化，Dennis 两个都需要——投资用达利欧，生活用尼采。"}, {"n": 93, "title": "瓦尔登湖", "author": "梭罗", "cat": "国学与哲学", "essence": "28 岁的梭罗在瓦尔登湖边亲手盖了一间木屋，住了两年两个月又两天，只为验证一件事：人真正需要的东西其实很少，少到可以把大把时间还给自己。", "points": ["活得刻意：离开城镇不是逃避世事，而是一场实验——\"只面对生活的基本事实\"，看清哪些是真正的必需、哪些是社会塞给他的欲望。", "简化的经济学：他逐项记账（建房总共只花了 28.125 美元），算出靠几周劳作就能覆盖一年的基本开销；结论是\"一个人的富有，与他能够放下多少东西成正比\"。", "警惕\"平静的绝望\"：大多数人一辈子为房贷、体面和攀比打工，还以为那就是生活本身；梭罗说，那只是因为他们没想过还有别的活法。"], "concept": "简化（Simplify, simplify）；刻意地生活（live deliberately）。", "extra_label": "经典金句", "extra": "\"我步入丛林，因为我希望活得有意义，我希望活得深刻，汲取生命所有的精髓，把一切非生命的东西全部驱逐。\"", "use": "不是让他辞店归隐——梭罗住满两年就回城了，实验的重点是\"试过、算清、想明白\"。Dennis 版瓦尔登湖是三笔账：一算消费账，哪些支出是真必需、哪些是跟风（新款数码、囤的课），省下的每一块钱都是定投的子弹；二算时间账，店里的重复劳动能不能流程化，换出每天一小时给 AI 项目；三算欲望账，别拿\"别人赚多少\"当自己的成本线。这本和他的定投气质天然合拍：低物欲＋长期主义，就是普通人积累第一桶金的底层配置。", "link": "与《反脆弱》（005）的\"减法智慧（via negativa）\"是同一味药的两种熬法——塔勒布说少做错事比多做对事重要，梭罗直接活给你看；它也给后面的《把时间当作朋友》（098）打了前站：梭罗省下来的表面是钱，实质是时间。"}, {"n": 94, "title": "高效能人士的七个习惯", "author": "柯维", "cat": "国学与哲学", "essence": "高效能不是时间管理技巧，而是品格的次序问题：先从依赖走向独立（习惯 1–3），再从独立走向互赖（习惯 4–6），最后用更新（习惯 7）让整套系统不报废。", "points": ["习惯 1–3 管\"自己\"：积极主动（只盯影响圈，不怨环境）、以终为始（先在脑子里把一生\"建造\"一遍，写下个人使命）、要事第一（把时间投给\"重要不紧急\"的第二象限，而不是天天救火）。", "习惯 4–6 管\"与人\"：双赢思维、知彼解己（先理解对方、再求被理解，即移情式倾听）、统合综效（让 1+1>2，分歧不是威胁，而是第三种选择的入口）。", "习惯 7 不断更新是发动机：身体、精神、智力、社会情感四个维度定期\"磨锯子\"——锯子钝了还硬砍的人，越砍越慢。"], "concept": "关注圈 vs 影响圈；时间管理矩阵（第二象限优先）。", "extra_label": "经典案例", "extra": "习惯 2 的\"葬礼练习\"——闭上眼，想象三年后你自己的葬礼，听四个人致悼词：家人、朋友、同事、社群伙伴。想清楚\"希望他们说些什么\"，你这辈子的优先级就自动排好了。柯维提醒：很多人爬了一辈子梯子，爬到顶才发现梯子搭错了墙。", "use": "\"关注圈/影响圈\"直接治他的盯盘焦虑：大盘红绿、KOSPI 涨跌是关注圈（控制不了）；每月 2000 按时扣款、店里品控、每天学 10 条是影响圈（说一不二）——精力只投后者，焦虑自然降一半。\"要事第一\"治他的项目并行症：漫剧、工作台、变现、学习全是重要不紧急的第二象限事项，最容易被短视频和刷盘挤掉，必须主动排进日程，而不是\"有空再做\"。而习惯 7，正是他这套每日自学机制的理论出处。", "link": "《原则》（003）的品格版近亲——达利欧讲\"把生活变成可迭代的原则系统\"，柯维讲\"由内而外的品格次序\"，一个是桥水掌门的操作系统，一个是普通人的。下一本《最重要的事，只有一件》（095）就是把\"要事第一\"再拧紧一圈：要事不止一件时，到底先做哪件。"}, {"n": 95, "title": "最重要的事，只有一件", "author": "加里·凯勒", "cat": "成长与行动", "essence": "成功不是\"把所有事都做完\"的艺术，而是删繁就简的纪律——找到\"做了它、其他事都变得更简单或不再必要\"的那一件事，先做完它。", "points": ["聚焦问题（全书的引擎）：\"我能做的最重要的那一件事情是什么？做完它之后，其他事情都会变得更简单，或者根本没必要做了。\"每天、每周、每年各问一遍，答案就是行动清单的第一项。", "戳破六个谎言：每件事都重要（错，要紧的只有少数）、多任务处理（错，那只是来回切换的损耗）、靠意志力硬扛（错，意志力是电池，用完必须充）、工作生活必须平衡（错，长周期里只能动态制衡）、大目标吓人（错，恰恰要往大里想）、照抄成功公式（关键不在公式，在倒推）。", "目标倒推到\"此刻\"：从\"有朝一日\"的终极目标一路倒推——五年、一年、本月、本周、今天、现在；任何宏大目标，最终都收束为\"此刻能做的那一件事\"，其余的只是按顺序排队。"], "concept": "聚焦问题（The Focusing Question）；多米诺效应。", "extra_label": "经典案例", "extra": "多米诺的几何级数：第一张骨牌只有约 5 厘米高，之后每张比前一张大 50%——第 18 张已与比萨斜塔齐高，第 23 张高过埃菲尔铁塔，第 31 张高出珠穆朗玛峰，第 57 张几乎能搭一座通往月球的桥。第一步根本不需要大，关键是顺序对、别停手。", "use": "这本简直是为他量身的：熟食店＋漫剧＋收藏夹＋工作台＋变现＋每日学习，摊子铺得比时间多，他的真问题从来不是不努力，而是同时推六张牌、每张都只推一半。用法很具体：① 每天开工前只写一行\"今天的 ONE Thing\"（比如：漫剧第 2 集分镜表定稿），它没完成，其他都是干扰；② 定投本身就是多米诺：每月 2000 是第一张小牌，二十年不断就是几何级数，不要因为牌小而看不起它；③ 手机是干扰大户，推牌的那一两个小时，手机扣放、开勿扰。", "link": "《七个习惯》（094）\"要事第一\"的极端化续作——柯维说优先做第二象限，凯勒说第二象限里还要再砍，砍到只剩一件；它的\"目标倒推\"与达利欧《原则》（003）五步流程的第一步（明确目标）同构，只是更狠：直接倒推到\"此刻我能做的那一件事\"。"}, {"n": 96, "title": "深度工作", "author": "卡尔·纽波特", "cat": "成长与行动", "essence": "在注意力被手机切碎的时代，能长时间无干扰地攻坚复杂问题，正在变成稀缺能力——谁保得住整块的专注，谁就拿走这个时代的超额回报。", "points": ["深度工作 vs 浮浅工作：深度工作（无干扰、在认知极限处推进）创造真正价值且难以复制；浮浅工作（回消息、刷动态、处理琐碎事务）看似忙碌，替代性却极强——忙碌从来不等于生产力。", "注意力残留：任务一切换，前一件事会占着一部分脑力（已被心理学实验证实）——一天切换几十次的人，等于全天只用七成大脑干活，\"多任务高效\"纯属自欺欺人。", "四大准则：工作要深（建立固定仪式和专用时段）、学会忍受无聊（一有空隙就掏手机，等于在训练分心）、远离社交媒体（用\"工匠标准\"筛工具：对核心目标没有强正收益的就扔）、排干浮浅（给琐事设总量上限和截止时间）。"], "concept": "深度工作/浮浅工作；注意力残留。", "extra_label": "经典案例", "extra": "荣格为了写《心理学类型》，在苏黎世湖畔的波林根亲手建了一座石塔，没通电、没自来水，白天写作思考、劈柴挑水，他的多部重要著作在那里成型；而他的论敌弗洛伊德留在繁华的维也纳。纽波特用这组对照说明：深度产出靠的往往是物理层面的\"隔绝仪式\"，而不是自律硬撑。", "use": "他全部生产活动都挤在一部安卓手机里——微信、行情、短视频、订单消息同屏抢注意力，他就是最需要\"深度时段\"的典型人群。落地版方案：① 固定锚点：每天选店里相对清闲的一个时段（如午后休息档），60–90 分钟只做一件深活（漫剧分镜/AI 项目），手机开勿扰、扣放在桌上；② 关机仪式：深活结束前花 5 分钟记下\"下次从哪接着做＋明天第一件事\"，第二天的切入成本大降；③ 浮浅定额：刷盘、刷 AI 资讯可以有，但装进固定时段（比如就着早饭那 20 分钟），别让它全天渗漏。096 落地之后，095 的\"那一件最重要的事\"才有地方发生。", "link": "是《最重要的事，只有一件》（095）的\"施工图\"——095 告诉你选哪张牌，096 告诉你用什么环境把牌推倒；它和《思考，快与慢》（001）也互补：卡尼曼说系统 1 爱偷懒，纽波特干脆给系统 2 造一间没有诱惑的屋子。"}, {"n": 97, "title": "原子习惯", "author": "詹姆斯·克利尔", "cat": "成长与行动", "essence": "改变不靠惊天动地的决心，靠每天进步 1% 的小习惯复利；你不会上升到目标的高度，你只会跌落到系统的水平。", "points": ["身份先行：目标型习惯问\"我想达成什么\"，身份型习惯问\"我想成为什么样的人\"——每完成一次小行动，就是给\"我是这样的人\"投一票，选票攒够了，行为自然跟上。", "行为改变四定律：让它显而易见（提示）、让它有吸引力（渴求）、让它简便易行（反应）、让它令人愉悦（奖励）；改掉坏习惯，就把这四条全部反过来用。", "环境大于意志：所谓自律的人，多半不是意志更强，而是把诱惑从环境里删掉了；再配上习惯叠加（在旧习惯后面立刻接上新习惯）和两分钟法则（新习惯先缩小到两分钟就能启动的版本），系统会自己跑起来。"], "concept": "习惯回路（提示→渴求→反应→奖励）；1% 复利（每天进步 1%，一年后约是原来的 37.78 倍）。", "extra_label": "经典案例", "extra": "英国自行车队一百多年没拿过大赛冠军，总教练布莱尔斯福德推行\"边际收益聚合\"：把骑行拆成上百个细节逐个优化 1%——座椅舒适度、按摩凝胶的涂法，甚至请外科医生教全队正确洗手以减少感冒。五年后，英国车队横扫环法和奥运会。", "use": "他的定投其实已经是教科书级的原子习惯：金额小（每月 2000 元）、自动化（条件单扣款）、不依赖意志力——要补的只有一条\"永不缺席两次\"：10 月那次扣款失败属于系统故障（余额不足），修好故障继续跑，别因此否定整个系统。其他目标同理套四定律：想推进漫剧——用习惯叠加，\"晚饭后立刻打开分镜表，先干两分钟\"（两分钟法则负责启动）；想少刷手机——让它\"不显眼\"：删掉行情 App 的桌面图标、关掉推送，环境设计比咬牙硬忍管用一百倍。", "link": "《习惯的力量》（011）的实操升级版——杜希格讲清了\"提示—惯例—奖励\"的回路原理，克利尔把它改造成四条能亲手拧的旋钮；\"跌落到系统的水平\"这句，几乎是给梅多斯《系统之美》（009）打的广告：别改目标，改系统。它和上一本《深度工作》（096）是配套件：096 要保住整块时间，097 负责把这件事变成不用想的日常。"}, {"n": 98, "title": "把时间当作朋友", "author": "李笑来", "cat": "成长与行动", "essence": "时间根本管不了，能管的只有你自己；一切都靠积累，成败的分水岭，是你能不能熬过复利曲线那段\"看不到回报\"的成本期。", "points": ["时间是朋友还是敌人，取决于你站在哪边：每天把时间兑换成积累（技能、作品、资产）的人，时间越久越占便宜；追求速成、频繁换赛道的人，等于每次都在曲线归零处重新开始。", "复利曲线与成本线：任何长期投入，前期产出都低于付出（曲线趴在成本线之下），熬过交叉点之后曲线陡峭上扬——大多数人失败，不是因为选错了事，而是倒在拐点前夜。", "速成绝无可能，交换才是硬道理：与其研究\"如何管理时间\"，不如研究\"如何用当下的时间，交换未来想要的东西\"，并接受交换必然缓慢；耐心不是美德问题，是数学问题。"], "concept": "复利曲线（它与成本线的交叉点就是分水岭）；积累（一切进步的唯一通道）。", "extra_label": "经典案例", "extra": "书里反复拆解的\"学英语为什么总失败\"：单词书买了五六本、方法换了十几种的人大有人在，最后没学成的几乎都不是方法错，而是积累的量没熬到拐点就弃学了——换一条新曲线，就是重新从成本线下开始，一辈子都在给各种\"新开始\"交学费。", "use": "这本几乎是直接写给他的定投的：每月 2000 元投标普 500ETF 博时（513500）＋纳斯达克 ETF 华夏（513300），前几年曲线大概率趴在成本线附近甚至之下，碰上熊市更难看——这本书就是提前打好的预防针：那不是定投失效，那是复利曲线的标准长相，拐点只奖励不下车的人。他这套每日自学（读书、学 AI 工具、攒收藏夹知识库）同样是积累型资产：单日看毫无变化，按年看是别人追不上的存量。店里的手艺和口碑也是同理——熟食这行没有速成，只有日复一日的稳定出品。", "link": "李笑来后来的《财富自由之路》（023）就是这本的\"赚钱续集\"——从\"时间是朋友\"推进到\"注意力才是最宝贵的资产、个人商业模式如何升级\"；它和芒格《穷查理宝典》（002）隔空击掌：芒格把复利称作世界第八大奇迹，李笑来把复利画成了一张普通人能对号入座的曲线图。"}, {"n": 99, "title": "认知觉醒", "author": "周岭", "cat": "成长与行动", "essence": "人有三重大脑——本能脑、情绪脑、理智脑，前两个强大又短视；成长，就是让最弱的理智脑学会\"元认知\"，在关键时刻能跳出来，看着自己做选择。", "points": ["三重大脑的博弈：本能脑求生存、情绪脑求即时快感，理智脑起步晚、耗能高、易疲劳——所以\"道理都懂，就是做不到\"不是你的错，是出厂配置；解法不是骂自己，而是替理智脑设计战术。", "元认知是最高级的武器：能\"想自己的所想\"——刷手机时意识到\"我正在被情绪脑劫持\"，行动前多问一句\"这是我真想要的吗\"。这一层觉察，就是觉醒的起点。", "舒适区边缘与输出倒逼输入：真正的成长只发生在舒适区边缘（太易则无聊，太难则崩溃）；而写作、讲解这类\"输出\"会反过来逼着输入变深——再配上足够的耐心，改变才会真正发生。"], "concept": "元认知；舒适区边缘。", "extra_label": "经典金句", "extra": "\"焦虑的根源就两条：想同时做很多事，又想立马有收获。\"", "use": "这本像给他做的一份体检报告：摊子多（店＋五个 AI 方向）、性子急（长任务没进度播报就催）、手机不离手——三重大脑的毛病全中。可用工具就三个：① 元认知开关：想冲动操作时先默念一句\"这是情绪脑在喊\"，停 10 秒再决定，多数冲动会自动熄火；② 用舒适区边缘排任务：学漫剧别一上来啃最难的生成环节，从\"今天只定一版分镜提示词\"这种够得着的难度切入；③ 输出倒逼输入：他交代我学的东西，最后都变成笔记、清单和交付物——这正是这套每日自学机制本身的设计，所以别停，它就是觉醒的练习场。", "link": "《思考，快与慢》（001）的中国进化版——卡尼曼的系统 1/系统 2，在这里拆成了本能脑＋情绪脑 vs 理智脑，多讲了进化的来源，还递上一把\"元认知\"的钥匙；它也是《深度工作》（096）的心理学地基：纽波特讲\"要专注\"，周岭先讲清\"为什么你专注不了\"，地基打完，096、097 的方法才落得下去。"}, {"n": 100, "title": "纳瓦尔宝典", "author": "埃里克·乔根森", "cat": "成长与行动", "essence": "硅谷投资人纳瓦尔·拉维康特的财富与幸福算法：追求财富而非金钱，用\"专长×杠杆×复利\"让自己产品化，再把幸福当作一项可以练习的技能单独修完。", "points": ["追求财富，不要追求金钱和地位：财富是睡觉时仍在为你赚钱的资产（股权、产品、版税、代码）；出租时间永远有天花板——\"你不会靠出租自己的时间变富\"，必须拥有资产的所有权。", "让自己产品化：先找到你的\"专长\"（specific knowledge，不是学校里教的那种，而是你做起来像玩、别人学起来费劲的那种本事），再配上无需许可的杠杆——代码和媒体：写一次、用无限次、边际成本近乎为零；一个人，就是一家媒体公司加一座产品工厂。", "一切回报都来自复利，而幸福要另外修：财富、知识、人品、声誉全是复利游戏，关键是找到值得玩几十年的游戏和值得长期相处的人；幸福不会等有钱了自动到账——\"欲望，是与自己的不幸福签下的一份合同\"，幸福是当下就能训练的选择。"], "concept": "专长（specific knowledge）；无需许可的杠杆（代码与媒体）；让自己产品化（Productize Yourself）。", "extra_label": "经典案例", "extra": "纳瓦尔本人——印度移民家庭出身，靠读书爬出贫民窟，先做连续创业者（Epinions），再做天使投资人（早期投中推特、优步）；2018 年他在推特上发出那串后来成为本书源头的\"如何致富（无需运气）\"长推，用媒体杠杆把二十年积累一次性免费讲给全世界听——他自己，就是自己理论的标本。", "use": "他的处境正是这本书的典型读者：熟食店是典型的\"出租时间\"模式（不开门就没收入，天花板焊死），所以第二曲线必须长成资产型——① 定投就是平民版\"睡觉时赚钱的资产\"，每月 2000 元不多，但它买的是资产不是工资，方向完全对；② 他的专长是现成的稀缺组合——\"多年熟食手艺×AI 工具链\"，全国没几个人同时懂这两样，漫剧、反推提示词包、AI 代做接单页，都是在把这个组合产品化；③ 媒体杠杆他已经在用（产品化的单文件交付），差的只是持续输出、等复利拐点。幸福那半本也得读：别把\"等赚够了再说\"设成默认——能守店、能定投、能折腾新东西的当下，本身就是纳瓦尔说的那种\"已经很富\"的日子。", "link": "与李笑来《财富自由之路》（023）是两位\"个人财富哲学家\"的隔洋对话——李笑来说\"你的终极资产是注意力、要把同一份时间卖出很多次\"，纳瓦尔说\"专长×杠杆、让自己产品化\"，翻译过来是同一句话；它的复利观又与《把时间当作朋友》（098）在收官位置完成闭环：098 说时间会站在积累这边，100 补上下半句——前提是你选对了值得长期积累的资产和游戏。"}];
const LEARNED = 5; // 每日一书已讲到 Day 5《反脆弱》（装机时进度）
const CATS = ["全部", ...new Set(BOOKS.map(b=>b.cat))];
let curCat = "全部", curBook = null;
const readSet = new Set(JSON.parse(localStorage.getItem("hema-books100-read")||"[]"));

const $ = id => document.getElementById(id);
function saveRead(){ localStorage.setItem("hema-books100-read", JSON.stringify([...readSet])); }
function refreshProg(){
  $("pLearned").textContent = LEARNED;
  $("pRead").textContent = readSet.size;
  $("pBar").style.width = Math.max(LEARNED, readSet.size) + "%";
}
function renderCats(){
  $("cats").innerHTML = CATS.map(c=>`<div class="cat ${c===curCat?'on':''}" data-c="${c}">${c}</div>`).join("");
  document.querySelectorAll(".cat").forEach(el=>el.onclick=()=>{curCat=el.dataset.c;renderCats();renderGrid();});
}
function renderGrid(){
  const q = $("q").value.trim();
  const list = BOOKS.filter(b => (curCat==="全部"||b.cat===curCat) && (!q || b.title.includes(q)||b.author.includes(q)));
  $("grid").innerHTML = list.length ? list.map(b=>`
    <div class="card" data-n="${b.n}">
      ${b.n<=LEARNED?`<div class="badge">Day ${b.n} 已讲</div>`:""}
      ${readSet.has(b.n)?`<div class="readmark">✓ 已读</div>`:""}
      <div class="no">第 ${b.n} 本 · ${b.cat}</div>
      <div class="t">《${b.title}》</div>
      <div class="a">${b.author}</div>
      <div class="e">${b.essence}</div>
    </div>`).join("") : `<div class="empty">没找到这本书，换个关键词试试</div>`;
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>openBook(+el.dataset.n));
}
function bookText(b){
  let t = `《${b.title}》——${b.author}\n一句话精华：${b.essence}\n核心观点：\n` +
    b.points.map((p,i)=>`${i+1}. ${p}`).join("\n") + `\n关键概念：${b.concept}\n`;
  if (b.extra) t += `${b.extra_label}：${b.extra}\n`;
  t += `对我的用处：${b.use}`;
  return t;
}
function openBook(n){
  curBook = BOOKS.find(b=>b.n===n);
  const b = curBook;
  $("dwrap").innerHTML = `
    <div class="dno">第 ${b.n} 本 · ${b.cat}${b.n<=LEARNED?` · 每日一书 Day ${b.n} 已讲`:""}</div>
    <div class="dt">《${b.title}》</div>
    <div class="da">${b.author}</div>
    <div class="ess">${b.essence}</div>
    <div class="sec"><h3>核心观点</h3><ol>${b.points.map(p=>`<li>${p}</li>`).join("")}</ol></div>
    <div class="sec"><h3>关键概念</h3><p>${b.concept}</p></div>
    ${b.extra?`<div class="sec"><h3>${b.extra_label}</h3><p>${b.extra}</p></div>`:""}
    <div class="sec"><h3>对我的用处</h3><p>${b.use}</p></div>
    ${b.link?`<div class="sec"><h3>和别的书的联系</h3><p>${b.link}</p></div>`:""}
    <div class="markrow"><div class="btn" id="btnMark">${readSet.has(b.n)?"↩ 取消已读":"✓ 标记为已读"}</div></div>`;
  $("detail").style.display = "block";
  $("detail").scrollTop = 0;
  $("btnMark").onclick = ()=>{ readSet.has(b.n)?readSet.delete(b.n):readSet.add(b.n); saveRead(); refreshProg(); renderGrid(); openBook(b.n); };
}
$("btnBack").onclick = ()=>{ stopSpeak(); $("detail").style.display="none"; };
let speaking = false;
function stopSpeak(){ if("speechSynthesis" in window) speechSynthesis.cancel(); speaking=false; $("btnSpeak").textContent="🔊 朗读"; }
$("btnSpeak").onclick = ()=>{
  if (!curBook) return;
  if (speaking){ stopSpeak(); return; }
  if (!("speechSynthesis" in window)){ alert("这台设备不支持朗读"); return; }
  const u = new SpeechSynthesisUtterance(bookText(curBook).replace(/[《》]/g,""));
  u.lang = "zh-CN"; u.rate = 1.0;
  u.onend = ()=>{ speaking=false; $("btnSpeak").textContent="🔊 朗读"; };
  speechSynthesis.speak(u); speaking = true; $("btnSpeak").textContent = "⏸ 停止朗读";
};
$("btnCopy").onclick = async ()=>{
  if (!curBook) return;
  const t = bookText(curBook);
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  $("btnCopy").textContent = "✓ 已复制"; setTimeout(()=>$("btnCopy").textContent="📋 复制笔记",1200);
};
