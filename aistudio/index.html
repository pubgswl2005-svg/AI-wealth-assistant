<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>个人AI工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg0:#050914;--bg1:#0a1226;--card:rgba(255,255,255,.045);--line:rgba(120,181,255,.13);
--tx:#eef4ff;--sub:#9fb2d8;--dim:#5f7194;--acc:#3f9dff;--acc2:#7c5cff;--ok:#22c58b;--warn:#ffb020;--bad:#ff5d6c}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#12245c 0%,transparent 60%),radial-gradient(900px 500px at 10% 110%,#0e2a5e 0%,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg0));
color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;overflow-x:hidden;max-width:430px;margin:0 auto;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(420px 220px at 12% 8%,rgba(64,140,255,.14),transparent 70%),radial-gradient(500px 260px at 88% 30%,rgba(124,92,255,.12),transparent 70%),radial-gradient(600px 300px at 50% 100%,rgba(34,197,139,.07),transparent 70%)}
#app{display:flex;min-height:100vh;position:relative;z-index:1}
/* 左图标轨 */
#rail{width:66px;flex:0 0 66px;background:rgba(6,10,24,.72);backdrop-filter:blur(14px);border-right:1px solid var(--line);
display:flex;flex-direction:column;align-items:center;padding:10px 0 90px;gap:2px;overflow-y:auto;position:sticky;top:0;height:100vh;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.rlogo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#2f7bff,#7c5cff);display:flex;align-items:center;justify-content:center;
font-weight:900;font-style:italic;font-size:19px;color:#fff;margin-bottom:8px;box-shadow:0 4px 16px rgba(63,157,255,.4)}
.rbtn{width:58px;border:0;background:none;color:var(--sub);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;
padding:7px 2px;border-radius:12px;cursor:pointer;line-height:1.25}
.rbtn .ic{font-size:19px}
.rbtn.on{background:linear-gradient(135deg,rgba(47,123,255,.85),rgba(64,160,255,.65));color:#fff;box-shadow:0 4px 14px rgba(47,123,255,.35)}
/* 主区 */
.main{flex:1;min-width:0;padding:12px 12px 96px;overflow-x:hidden}
.page{display:none}.page.on{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd h1{font-size:21px;font-weight:800;background:linear-gradient(90deg,#7db9ff,#c9a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd .who{text-align:right;font-size:10px;color:var(--sub);line-height:1.6}
.hero{border-radius:20px;padding:16px;position:relative;overflow:hidden;margin-bottom:12px;min-height:128px;
background:linear-gradient(120deg,#0d1c44 20%,#132a6e 60%,#1b3a8f);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background:
radial-gradient(120px 60px at 78% 30%,rgba(255,214,120,.5),transparent 70%),
radial-gradient(200px 90px at 60% 100%,rgba(64,140,255,.35),transparent 70%);pointer-events:none}
.hero .greet{font-size:16px;font-weight:800;margin-bottom:4px;position:relative;z-index:1}
.hero .date{font-size:11px;color:var(--sub);position:relative;z-index:1}
.hero .castle{position:absolute;right:6px;bottom:0;width:150px;opacity:.95;z-index:0}
.runbadge{position:absolute;right:12px;top:12px;z-index:2;width:64px;height:64px;border-radius:50%;
background:conic-gradient(from 0deg,#22c58b,#3f9dff,#7c5cff,#22c58b);display:flex;align-items:center;justify-content:center;animation:spin 7s linear infinite}
.runbadge b{width:50px;height:50px;border-radius:50%;background:#0a1330;display:flex;align-items:center;justify-content:center;
font-size:8px;color:var(--ok);animation:spin2 7s linear infinite;line-height:1.3;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(-360deg)}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;backdrop-filter:blur(8px)}
.stat .t{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stat .t i{width:26px;height:26px;border-radius:8px;background:rgba(63,157,255,.16);display:flex;align-items:center;justify-content:center;font-size:14px;font-style:normal}
.stat .v{font-size:24px;font-weight:800}
.stat .d{font-size:10px;color:var(--ok);margin-top:4px}
.stat .d.down{color:var(--bad)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px}
.sec-title h3{font-size:15px;font-weight:800}
.sec-title a{font-size:11px;color:var(--sub);cursor:pointer}
.mods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;overflow:hidden}
.mod{min-width:0;border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.12);color:#fff;overflow:hidden}
.mod .mi{width:34px;height:34px;margin:0 auto 6px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:18px}
.mod b{display:block;font-size:10px;margin-bottom:3px;white-space:nowrap}
.mod span{display:block;font-size:8px;opacity:.85;line-height:1.4;min-height:23px}
.mod .go{display:inline-block;margin-top:6px;font-size:9px;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:20px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;backdrop-filter:blur(8px)}
.card h4{font-size:13px;margin-bottom:8px}
.proj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.pcard b{font-size:12px;display:block;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .tag{font-size:9px;color:var(--sub);margin-bottom:6px;display:block}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px}
.bar2{height:8px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden;margin:6px 0}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#22c58b,#3f9dff);border-radius:5px}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:14px}
/* 表单与列表 */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.fcard h3{font-size:14px;margin-bottom:10px}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:var(--tx);
padding:9px 10px;font-size:13px;margin-bottom:8px;font-family:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button.act{background:linear-gradient(135deg,#2f7bff,#5aa2ff);border:0;color:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
button.act.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:400}
button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer}
.item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item b{font-size:13px}.item p{font-size:11px;color:var(--sub);margin:4px 0;line-height:1.6;word-break:break-all}
.item .meta{font-size:10px;color:var(--dim);margin-top:4px}
.taskrow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.taskrow .no{width:22px;height:22px;border-radius:50%;background:rgba(63,157,255,.18);color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 22px}
.taskrow .tt{flex:1;min-width:0;font-size:12px}
.prio{font-size:9px;padding:2px 8px;border-radius:12px;flex:0 0 auto}
.p-hi{background:rgba(255,93,108,.16);color:#ff8b96}.p-mid{background:rgba(255,176,32,.16);color:#ffcf7a}.p-lo{background:rgba(34,197,139,.14);color:#5fe3ae}
/* 功能目录手风琴 */
.feat{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02)}
.feat>button{width:100%;background:none;border:0;color:var(--tx);text-align:left;padding:11px 12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.feat .f{display:none;padding:4px 12px 12px}
.feat.open .f{display:block}
.feat .f div{font-size:11px;color:var(--sub);padding:5px 0 5px 14px;position:relative;line-height:1.6}
.feat .f div::before{content:"·";position:absolute;left:4px;color:var(--acc)}
.feat .f div b{color:var(--tx);font-weight:600}
/* 部门 */
.dept{margin-bottom:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}
.dept>button{width:100%;background:none;border:0;color:var(--tx);text-align:left;padding:13px;font-size:14px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.dept .mods2{display:none;padding:0 12px 12px;display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dept.open .mods2{display:grid}
.mods2 .mod b{font-size:11px}.mods2 .mod span{font-size:9px;min-height:0}
/* 员工/执行 */
.emp{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.emp .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2f7bff,#7c5cff);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 40px}
.emp .in{flex:1;min-width:0}.emp .in b{font-size:13px}.emp .in p{font-size:10px;color:var(--sub);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.st0{background:#5f7194}.st1{background:#3f9dff;box-shadow:0 0 6px #3f9dff}.st2{background:#22c58b}.st3{background:#ff5d6c}.st4{background:#ffb020}
.step{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:6px}
.step .n{flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:rgba(63,157,255,.16);color:var(--acc);font-size:10px;display:flex;align-items:center;justify-content:center}
.step .b{flex:1;min-width:0}.step .b p{font-size:12px}.step .b small{font-size:10px;color:var(--dim);display:block;margin-top:3px;line-height:1.5}
.stag{font-size:9px;padding:2px 8px;border-radius:10px;flex:0 0 auto}
.kv{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:5px 0;border-bottom:1px solid rgba(120,181,255,.07)}
.kv b{color:var(--tx)}
.note{font-size:10px;color:var(--dim);line-height:1.7;background:rgba(255,176,32,.06);border:1px solid rgba(255,176,32,.2);border-radius:10px;padding:8px 10px;margin:8px 0}
.stars{color:#ffb020;font-size:13px;letter-spacing:2px}
/* 底部导航 */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;
background:rgba(8,13,30,.88);backdrop-filter:blur(18px);border-top:1px solid var(--line);
display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;color:var(--dim);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;padding:4px 0}
.tab .ic{font-size:20px}.tab.on{color:var(--acc)}
.tab .bdg{position:absolute;top:0;right:calc(50% - 20px);background:#ff5d6c;color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.micbtn{flex:1;display:flex;justify-content:center;align-items:flex-start}
.micbtn button{width:56px;height:56px;border-radius:50%;border:3px solid rgba(63,157,255,.35);cursor:pointer;
background:radial-gradient(circle at 35% 30%,#6db4ff,#2f7bff 70%);color:#fff;font-size:24px;margin-top:-24px;box-shadow:0 6px 20px rgba(47,123,255,.5)}
.ver{text-align:center;font-size:9px;color:var(--dim);margin:16px 0 4px}
h2.pt{font-size:17px;margin-bottom:10px}
.searchbar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg1),transparent);padding:4px 0 8px}
</style>
</head>
<body>
<div id="app">
<aside id="rail"></aside>
<main class="main">
<!-- 首页驾驶舱 -->
<section class="page" id="page-home"></section>
<!-- 公司 -->
<section class="page" id="page-company"></section>
<!-- AI指挥 -->
<section class="page" id="page-cmd"></section>
<!-- 项目 -->
<section class="page" id="page-projects"></section>
<!-- 通用模块页 -->
<section class="page" id="page-mod"><div id="modBody"></div></section>
<!-- 我的 -->
<section class="page" id="page-my"></section>
</main>
<nav id="tabbar"></nav>
</div>
<script>
/* ================= 数据层：统一数据库 ================= */
const DBKEY="aistudio_v3";
let db=null;
try{db=JSON.parse(localStorage.getItem(DBKEY))}catch(e){db=null}
if(!db){ // 从 v2 迁移
  let old=null;try{old=JSON.parse(localStorage.getItem("aistudio_v2"))}catch(e){}
  db={biz:[],game:[],media:[],invest:[],ideas:[],tasks:[],money:[],log:[],goals:[],
      know:[],customers:[],employees:[],workflows:[],execs:[],assets:[],publish:[],
      miles:[],files:[],news:[],toolsx:[],clouds:[],contracts:[],appfac:[],prodfac:[],opp:[],backups:[]};
  if(old){["biz","game","media","invest","ideas","tasks","money","log","goals"].forEach(k=>{if(old[k])db[k]=old[k]});
    db.tasks.forEach(x=>{if(x.st===undefined)x.st=x.done?2:0});
    logA("从旧版数据迁移完成");}
}
const ALLCOLLS=["biz","game","media","invest","ideas","tasks","money","log","goals","know","customers","employees","workflows","execs","assets","publish","miles","files","news","toolsx","clouds","contracts","appfac","prodfac","opp","backups","qlist"];
ALLCOLLS.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
if(!db.budgets)db.budgets={};if(!db.settings)db.settings={};
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(e){alert("存储空间不足，备份后清理")}}
function logA(t){db.log.unshift({t,at:Date.now()});db.log=db.log.slice(0,80)}
function uid(){return Date.now()*1000+Math.floor(Math.random()*999)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fdate(ts){const d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
/* ================= 版块定义 ================= */
const SECTIONS=[
 {id:"home",ic:"🏠",name:"首页",tab:"home"},
 {id:"company",ic:"🏢",name:"公司",tab:"company"},
 {id:"cmd",ic:"🎛",name:"AI指挥",tab:"cmd"},
 {id:"projects",ic:"📁",name:"项目",tab:"projects"},
 {id:"biz",ic:"💼",name:"创业中心",dept:"biz"},
 {id:"opp",ic:"💡",name:"赚钱机会",dept:"biz"},
 {id:"crm",ic:"🤝",name:"客户销售",dept:"biz"},
 {id:"mkt",ic:"📣",name:"营销推广",dept:"biz"},
 {id:"prodfac",ic:"📦",name:"产品工厂",dept:"biz"},
 {id:"game",ic:"🎮",name:"游戏工作室",dept:"game"},
 {id:"appfac",ic:"🛠",name:"应用工厂",dept:"game"},
 {id:"media",ic:"🎬",name:"内容工作室",dept:"media"},
 {id:"inv",ic:"📈",name:"投资研究",dept:"inv"},
 {id:"tools",ic:"🧰",name:"软件工具",dept:"tech"},
 {id:"cloud",ic:"☁",name:"云服务器",dept:"tech"},
 {id:"news",ic:"🌐",name:"全球资讯",dept:"mkt2"},
 {id:"money",ic:"¥",name:"经营账本",dept:"fin"},
 {id:"perf",ic:"📊",name:"绩效质量",dept:"fin"},
 {id:"data",ic:"📉",name:"数据分析",dept:"data"},
 {id:"kb",ic:"🧠",name:"知识大脑",dept:"data"},
 {id:"mgmt",ic:"👔",name:"公司管理",dept:"mgmt"},
 {id:"engine",ic:"⚙",name:"执行引擎",dept:"mgmt"},
 {id:"ai",ic:"🤖",name:"AI助手",dept:"mgmt"},
 {id:"legal",ic:"📜",name:"合同合规",dept:"mgmt"},
 {id:"files",ic:"🗂",name:"文件中心",dept:"mgmt"},
 {id:"autos",ic:"🔧",name:"自动化",dept:"mgmt"},
 {id:"tasks",ic:"✓",name:"任务中心",dept:"mgmt"},
 {id:"ideas",ic:"💡",name:"创意库",dept:"mgmt"},
 {id:"my",ic:"👤",name:"我的",tab:"my"},
];
const DEPTS=[
 {id:"biz",ic:"🚀",name:"创业商业部",color:"linear-gradient(135deg,#ff9a3d,#ff5d6c)",mods:["biz","opp","crm","mkt","prodfac"],descs:["数字商品·商业模式","全球赚钱机会","客户与销售","营销推广","产品工厂"]},
 {id:"game",ic:"🎮",name:"游戏研发部",color:"linear-gradient(135deg,#7c5cff,#3f9dff)",mods:["game","appfac"],descs:["游戏项目","应用开发工厂"]},
 {id:"media",ic:"🎬",name:"内容制作部",color:"linear-gradient(135deg,#ff5d8f,#ff8a5c)",mods:["media"],descs:["漫剧·视频·小说"]},
 {id:"inv",ic:"📈",name:"投资研究部",color:"linear-gradient(135deg,#22c58b,#3f9dff)",mods:["inv"],descs:["行情·策略·持仓"]},
 {id:"tech",ic:"🛠",name:"技术开发部",color:"linear-gradient(135deg,#3f9dff,#22d3ee)",mods:["tools","cloud","appfac"],descs:["软件工具","云服务器","应用工厂"]},
 {id:"mkt2",ic:"📣",name:"市场营销部",color:"linear-gradient(135deg,#ffb020,#ff8a5c)",mods:["mkt","news"],descs:["营销推广","全球资讯"]},
 {id:"fin",ic:"💰",name:"财务管理部",color:"linear-gradient(135deg,#f5c542,#ff9a3d)",mods:["money","perf"],descs:["经营账本","绩效质量"]},

 {id:"mgmt",ic:"🏢",name:"公司管理中心",color:"linear-gradient(135deg,#5f7194,#3f9dff)",mods:["mgmt","engine","ai","legal","files","autos","tasks","ideas"],descs:["AI团队","执行引擎","AI助手","合同合规","文件中心","自动化","任务","创意库"]},
];
function secById(id){return SECTIONS.find(s=>s.id===id)}
const NAMES={biz:"创业项目",game:"游戏项目",media:"内容项目",invest:"投资标的",appfac:"应用项目",prodfac:"产品",opp:"赚钱机会"};
const PROJCOLLS={biz:"biz",game:"game",media:"media",inv:"invest",appfac:"appfac",prodfac:"prodfac",opp:"opp"};
/* 真实定时任务清单（自动化中心展示） */

function subAI(mod){

const s=secById(mod);
const t="模块："+(s?s.name:mod)+"；需求："+q+"。要求：先分析再规划，然后执行并生成真实文件，完成后自检，交付时列明已完成/未完成/受限三档，不虚构结果，等我验收。";

function moneySum(){
  let income=0,exp=0;const m=todayStr().slice(0,7);
  let mincome=0,mexp=0;
  db.money.forEach(x=>{const a=+x.amount||0;
    if(x.type==="income"){income+=a;if(fdate(x.at).indexOf(m)===0||new Date(x.at).getMonth()===new Date().getMonth())mincome+=a}
    else{exp+=a;if(new Date(x.at).getMonth()===new Date().getMonth())mexp+=a}});
  return {income,exp,profit:income-exp,mincome,mexp,mprofit:mincome-mexp};
}
function allProjects(){
  const out=[];
  Object.keys(PROJCOLLS).forEach(sec=>{const coll=PROJCOLLS[sec];
    (db[coll]||[]).forEach(p=>out.push(Object.assign({sec},p)))});
  return out;
}

return '<div class="emp"><div class="av">'+(e.st===0?"💤":"🤖")+'</div><div class="in"><b>'+esc(e.name)+'</b><p>'+esc(e.role||"")+' · '+deptName(e.dept)+'</p></div><span class="stag '+(e.st===0?"p-lo":"p-hi")+'">'+(e.st===0?"休假":"在岗")+'</span></div>';

function deptName(id){const d=DEPTS.find(d=>d.id===id);return d?d.name.replace(/部$/,""):"公司"}
function newExec(){
const n=document.getElementById("exName").value.trim(),q=document.getElementById("exReq").value.trim(),dp=document.getElementById("exDept").value;
if(!n||!q)return alert("填写任务名称和需求描述");
const steps=["需求分析：拆解需求要点","制定方案：输出执行方案","AI执行：生成指令发创始人（我）执行","结果检查：核对交付物","用户验收：等你确认","交付归档：记录归档"].map(t=>({t,st:0,note:""}));
db.execs.push({id:uid(),name:n,req:q,dept:dp,steps,cur:0,st:0,at:Date.now()});
document.getElementById("exName").value="";document.getElementById("exReq").value="";
logA("执行引擎接单："+n);save();render();
}
function execCard(x){
const done=x.steps.filter(s=>s.st===3).length;
const stTxt=["⏳ 待执行","▶ 执行中","🔍 等待验收","✅ 已完成","❌ 失败"][x.st];
return '<div class="item"><b>'+esc(x.name)+'</b> <span class="stag '+(x.st===3?"p-hi":x.st===4?"p-lo":"p-mid")+'">'+stTxt+'</span>'
+'<p>'+esc(x.req).slice(0,60)+'… · '+deptName(x.dept)+' · 进度 '+done+'/'+x.steps.length+'</p><div class="bar"><i style="width:'+Math.round(done/x.steps.length*100)+'%"></i></div>'
+x.steps.map((s,i)=>'<div class="step"><div class="n">'+(i+1)+'</div><div class="b"><p>'+esc(s.t)+'</p>'
+(s.note?'<small>📝 '+esc(s.note)+'</small>':"")
+'<div class="row" style="margin-top:6px"><button class="ghost" onclick="execStep('+x.id+','+i+')">'+EST[s.st]+' ›</button>'
+(s.t.indexOf("AI执行")===0?'<button class="ghost" onclick="execCopy('+x.id+')">复制指令</button>':"")
+'<button class="ghost" onclick="execNote('+x.id+','+i+')">备注</button></div></div></div>').join("")
+'<div class="row"><button class="ghost" onclick="execFinish('+x.id+')">🏁 完结</button><button class="ghost" onclick="execDel('+x.id+')">删除</button></div></div>';
}
function execStep(eid,i){
const x=db.execs.find(e=>e.id===eid);if(!x)return;const s=x.steps[i];
s.st=(s.st+1)%5; // 待执行→执行中→等待验收→已完成→失败→待执行
if(s.st===3)logA("执行步骤完成："+x.name+" / "+s.t);
save();render();
}
function execCopy(eid){
const x=db.execs.find(e=>e.id===eid);if(!x)return;
const t=""+x.name+"；需求："+x.req+"。要求：先分析再规划，然后执行并生成真实文件，完成后自检，交付时列明已完成/未完成/受限三档，不虚构结果，等我验收。";
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert("已复制，发到聊天里我就开工")).catch(()=>alert("复制失败"));
else alert(t);
}
function execNote(eid,i){
const x=db.execs.find(e=>e.id===eid);if(!x)return;
const n=prompt("步骤备注",x.steps[i].note||"");if(n===null)return;
x.steps[i].note=n;save();render();
}
function execFinish(eid){const x=db.execs.find(e=>e.id===eid);if(!x)return;x.st=3;x.steps.forEach(s=>{if(s.st<3)s.st=3});logA("执行任务完结："+x.name);save();render()}
function execDel(eid){if(!confirm("删除这条执行记录？"))return;db.execs=db.execs.filter(e=>e.id!==eid);save();render()}

    +'<button class="ghost" onclick="addMile('+p.id+',\''+esc(p.name)+'\')">+里程碑</button>'

function addProj(id){
  const coll=PROJCOLLS[id];
  const n=document.getElementById("pn-"+id).value.trim();if(!n)return alert("填写名称");
  const o={id:uid(),name:n,desc:document.getElementById("pd-"+id).value.trim(),prog:0,at:Date.now()};
  const x=document.getElementById("px-"+id);const y=document.getElementById("py-"+id);
  if(id==="biz"&&x)o.stage=x.value;
  if(id==="game"&&x){o.engine=x.value;o.build=y.value}
  if(id==="inv"&&x)o.risk=x.value;
  if(id==="opp"&&x)o.score=+x.value;
  db[coll].push(o);logA("新增"+NAMES[id]+"："+n);save();render();
}
function progStep(id,pid,d){const p=db[PROJCOLLS[id]].find(x=>x.id===pid);if(!p)return;p.prog=Math.max(0,Math.min(100,(+p.prog||0)+d));save();render()}
function delProj(id,pid){if(!confirm("删除？"))return;db[PROJCOLLS[id]]=db[PROJCOLLS[id]].filter(x=>x.id!==pid);db.miles=db.miles.filter(m=>m.pid!==pid);save();render()}
function oppToBiz(pid){const o=db.opp.find(x=>x.id===pid);if(!o)return;db.biz.push({id:uid(),name:o.name,desc:o.desc,prog:0,stage:"机会",at:Date.now()});logA("机会转项目："+o.name);save();render();alert("已转入创业中心")}

function addTask(){

  db.tasks.push({id:uid(),name:n,prio:document.getElementById("taskPrio").value,st:0,due:document.getElementById("taskDue").value,emp:document.getElementById("taskEmp").value||null,at:Date.now()});
  document.getElementById("taskName").value="";document.getElementById("taskDue").value="";

function perfHTML(){

function addGoal(){
  const n=document.getElementById("goalName").value.trim(),t=+document.getElementById("goalTarget").value,c=+document.getElementById("goalCur").value||0;
  if(!n||!(t>0))return alert("填写目标名称和目标值");
  db.goals.push({id:uid(),name:n,target:t,cur:c,at:Date.now()});
  logA("新增目标："+n);save();render();
}
function goalStep(id,d){const g=db.goals.find(g=>g.id===id);if(!g)return;g.cur=Math.max(0,g.cur+d);save();render()}
function delGoal(id){if(!confirm("删除？"))return;db.goals=db.goals.filter(g=>g.id!==id);save();render()}
function mkBackup(){
  const snap={at:Date.now(),size:ALLCOLLS.reduce((s,k)=>s+(db[k]||[]).length,0),data:JSON.stringify(db)};
  if(!db.backups)db.backups=[];
  db.backups.push({at:snap.at,size:snap.size,data:snap.data});
  db.backups=db.backups.slice(-5);
  logA("创建数据快照");save();render();alert("快照已保存");
}
function restoreBackup(i){
  if(!confirm("回滚到该快照？当前数据将被替换！"))return;
  const b=db.backups[i];if(!b)return;
  const cur=JSON.stringify(db);
  db=JSON.parse(b.data);
  if(!db.backups)db.backups=[];
  save();logA("数据回滚到快照");save();render();alert("已回滚");
}
function impJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object")throw 0;db=d;ALLCOLLS.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});logA("导入数据");save();render();alert("导入成功")}catch(e){alert("文件格式不对")}};
  r.readAsText(f);
}
function wipeData(){if(confirm("清空本机全部数据？此操作不可恢复！建议先备份快照。")){localStorage.removeItem(DBKEY);location.reload()}}
