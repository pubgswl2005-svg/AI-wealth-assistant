<!DOCTYPE html>
<html lang="zh-CN" data-theme="deep">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小坏蛋开工自检台 · v20261020-1</title>
<meta name="description" content="把学到的67个开源项目、88条提示词、漫剧/网页/App方法论，压成一张交付前必须过完的自检表。本地存储、离线可用、导出导入。">
<style>
:root{
  --bg:#070b16; --bg2:#0d1526; --card:rgba(255,255,255,.08); --card2:rgba(255,255,255,.05);
  --stroke:rgba(255,255,255,.16); --text:#eef4ff; --sub:#9fb2d1; --primary:#5ec8ff; --primary2:#7c5cff;
  --ok:#2ee6a8; --red:#ff3b30; --radius:20px; --shadow:0 12px 32px rgba(0,0,0,.35);
}
html[data-theme="bright"]{
  --bg:#eef3fb; --bg2:#e2ebfa; --card:rgba(255,255,255,.72); --card2:rgba(255,255,255,.55);
  --stroke:rgba(20,40,80,.12); --text:#12233f; --sub:#5a6f8f; --shadow:0 12px 28px rgba(30,60,120,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(900px 500px at 15% -5%,rgba(94,200,255,.28),transparent 60%),radial-gradient(800px 500px at 95% 10%,rgba(124,92,255,.22),transparent 55%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 8px}
.glass{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow)}
header{padding:20px 18px 16px;position:relative;overflow:hidden}
header h1{margin:0;font-size:24px;letter-spacing:.2px}
header p{margin:8px 0 0;color:var(--sub);font-size:13.5px;line-height:1.65}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(94,200,255,.16);border:1px solid rgba(94,200,255,.35);color:var(--primary);font-size:12px;font-weight:700}
.crit{color:var(--red);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{padding:12px 8px;text-align:center;border-radius:16px;background:var(--card2);border:1px solid var(--stroke)}
.stat b{display:block;font-size:20px}
.stat span{font-size:11.5px;color:var(--sub)}
.bar{height:10px;border-radius:99px;background:rgba(127,127,127,.22);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--ok));transition:width .35s ease}
.progressText{font-size:13px;color:var(--sub);margin-top:8px}
.progressText b{color:var(--text)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--stroke);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(12px)}
button:active{transform:scale(.98)}
button.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none}
input[type=search]{flex:1;min-width:170px;min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--stroke);background:var(--card);color:var(--text);font-size:15px;outline:none}
section{margin-top:14px;padding:16px 14px 8px}
section h2{margin:2px 4px 4px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
section h2 small{color:var(--sub);font-size:12px;font-weight:600}
.desc{margin:0 4px 10px;color:var(--sub);font-size:12.8px;line-height:1.6}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 10px;border-radius:14px;cursor:pointer}
.item:hover{background:var(--card2)}
.item input{width:22px;height:22px;margin-top:1px;accent-color:#17b978;flex:0 0 auto}
.item div{flex:1}
.item b{font-size:14.5px;line-height:1.45;display:block}
.item p{margin:3px 0 0;color:var(--sub);font-size:12.5px;line-height:1.55}
.item.done b{color:var(--sub);text-decoration:line-through}
.tag{font-size:10.5px;padding:2px 7px;border-radius:99px;background:rgba(255,59,48,.13);border:1px solid rgba(255,59,48,.35);color:var(--red);font-weight:800;white-space:nowrap}
.tag.blue{background:rgba(94,200,255,.13);border-color:rgba(94,200,255,.35);color:var(--primary)}
footer{color:var(--sub);font-size:12px;text-align:center;line-height:1.7;padding:18px 10px 6px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="glass">
    <span class="badge">自我发挥 · 实战演示 · 2026-10-20</span>
    <h1>🫧 小坏蛋开工自检台</h1>
    <p>学了不算，<b>用上才算</b>。这张表把最近学的 <b>67 个开源项目 + 88 条提示词 + 27 个收藏站</b>，压成了我每次交付前必须过完的检查项。以后再犯学过的错，这张表就是证据。</p>
    <div class="stats">
      <div class="stat"><b>67</b><span>开源项目</span></div>
      <div class="stat"><b>88</b><span>提示词</span></div>
      <div class="stat"><b>27</b><span>收藏站</span></div>
      <div class="stat"><b>4</b><span>方法论</span></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="progressText">总进度 <b id="pct">0%</b> · 已过 <b id="doneN">0</b> / <b id="totalN">0</b> 项 · 数据只存你手机本地，可导出备份</div>
  </header>

  <div class="toolbar">
    <input type="search" id="q" placeholder="搜检查项，比如：配音 / 截图 / 导出">
    <button id="themeBtn">☀️ 明亮</button>
    <button id="copyBtn" class="primary">复制自检结果</button>
    <button id="exportBtn">导出 JSON</button>
    <button id="importBtn">导入</button>
    <button id="resetBtn">重置</button>
    <input type="file" id="file" accept="application/json" class="hidden">
  </div>

  <div id="app"></div>

  <footer>
    本地优先四硬动作已落地：本地存储 ✓ · 导出/导入 ✓ · 离线可用 ✓ · 数据版本号 v1 ✓<br>
    版本 v20261020-1 · 单文件、无外部依赖、目标 &lt;50KB · 看页脚版本号确认是新版，旧文件删掉别留缓存
  </footer>
</div>

<script>
const CONFIG = {
  version: "v20261020-1",
  storageKey: "xiaohuaidan-qc-v1",
  dataVersion: 1,
  sections: [
    { id:"common", icon:"🧭", title:"通用开工", desc:"来源：ponytail 懒人阶梯 + 你的「知识必须应用 / 基础不用教」两条硬线。",
      items:[
        ["先查知识库再动手","开工先匹配 prompt-knowledge / bookmark-knowledge / daily-learn，有现成模板直接套，不从零编。",1],
        ["ponytail 阶梯防过度工程","能不做就不做 → 能用现成就不造 → 能单文件就不上工程 → 最后才写新代码。",0],
        ["结论先行，重要标红","先给结论再解释；重要信息用 🔴 红字突出，网址一律附纯文本可复制。",1],
        ["事实 / 推断 / 预测 / 建议分开写","实时行情、价格不编造；没验证的明确写「未验证」，不装确定。",1],
        ["交付前对照清单自检","学过的基础项是默认及格线，不等 Dennis 逐条指出才改。",1],
      ]},
    { id:"web", icon:"🌐", title:"网页交付", desc:"来源：GitHub 网页制作 12 项目（shadcn/ui、HyperUI、Vant、ECharts 等）提炼的 10 条改进。",
      items:[
        ["CONFIG 抽顶 + CSS 变量主题","文案/链接/数据放顶部 CONFIG；全站只用 --bg/--card/--primary 变量，换肤只换变量。",0],
        ["简单网格，拒绝卡顿 3D","默认流畅网格布局；不用 3D 球、不用无限 blob 动画；动效 ≤2 处且只用 transform/opacity。",1],
        ["手机三段式 + 触控 ≥44px","顶栏毛玻璃 + 中间滚动 + 底部安全区 env(safe-area-inset-bottom)；弹窗打开锁背景滚动防穿透。",0],
        ["性能预算 ≤400KB","图标用内联 SVG，不引全家桶；背景图先压缩再 base64；能静态就不挂 JS。",0],
        ["交付四步验证","①390px 渲染截图自查 ②逐项对差异、写满不缺项 ③断网打开测离线 ④快速滑动查帧感。全过才发。",1],
      ]},
    { id:"manga", icon:"🎬", title:"漫剧制作", desc:"来源：AI 漫剧 7 个开源项目 + 你三次配音反馈定下的规范。这是翻车最多、也最贵的一课。",
      items:[
        ["禁止静态图推拉冒充视频","严禁用分镜图 + zoompan 冒充动态；每镜头必须图生视频，真动作、真运镜、真特效。",1],
        ["先配音，整幕一遍过","先配音后画面；大 chunk（4000）整幕单次合成，减少拼接断点；全程烧录字幕。",1],
        ["配音：大陆普通话 + 语速 100","只用 accent=Chinese 声线，禁外国声线念中文；语速 100；台词按口语写，逗号只放真换气处。",1],
        ["人物分声必须听得出","不光 voice 不同，年龄/性别/音色要拉开；旁白与角色分声，外国声线糊成一团 = 没分声。",1],
        ["时长公式 + 防糊放大","单句时长 ≥ 字数÷4.5 + 2 秒余量；防糊用 4K 放大且不重构图；正片优先 Wan 1080P / MiniMax 2K。",0],
        ["百集一致性一份维护","角色四视图参考板 + 全局设定只维护一份，逐集引用，不每集重发明人物。",0],
      ]},
    { id:"app", icon:"📱", title:"App / 本地优先", desc:"来源：GitHub App 开发 13 项目（Flutter、Tauri、Capacitor、AppFlowy、Logseq 等）。",
      items:[
        ["本地优先四硬动作","本地存储 + 导出导入 + 离线可用 + 数据版本号，缺一不交付。",1],
        ["选型不重造轮子","现有网页变 APK 首选 Capacitor 套壳；全新 App 用 Expo + Ignite + gluestack-ui。",0],
        ["数据本地 + 权限可审计","个人数据默认留在本地；要联网/要权限，先说清拿什么、去哪、能不能关。",0],
        ["技能包是新资产","可复用的方法沉淀成纯 Markdown 技能文件，能安装、能迁移、换 AI 也能用。",0],
      ]},
  ]
};
let state = { dataVersion: CONFIG.dataVersion, checked:{}, theme:"deep" };
try{ const raw = localStorage.getItem(CONFIG.storageKey); if(raw){ const p=JSON.parse(raw); if(p && p.dataVersion===CONFIG.dataVersion) state=p; } }catch(e){}
const app = document.getElementById('app');
function render(){
  document.documentElement.dataset.theme = state.theme || "deep";
  document.getElementById('themeBtn').textContent = state.theme==="bright" ? "🌙 深空" : "☀️ 明亮";
  const q = (document.getElementById('q').value||"").trim().toLowerCase();
  app.innerHTML = "";
  let total=0, done=0;
  CONFIG.sections.forEach(sec=>{
    const items = sec.items.map((it,i)=>({t:it[0],d:it[1],crit:it[2],key:sec.id+"-"+i})).filter(x=>!q || (x.t+x.d).toLowerCase().includes(q));
    if(!items.length) return;
    const secDone = sec.items.filter((_,i)=>state.checked[sec.id+"-"+i]).length;
    const box=document.createElement('section'); box.className='glass';
    box.innerHTML = `<h2>${sec.icon} ${sec.title} <small>${secDone}/${sec.items.length} 已过</small></h2><p class="desc">${sec.desc}</p>`;
    items.forEach(x=>{
      total++; if(state.checked[x.key]) done++;
      const row=document.createElement('label'); row.className='item'+(state.checked[x.key]?' done':'');
      row.innerHTML=`<input type="checkbox" ${state.checked[x.key]?'checked':''}><div><b>${x.t} ${x.crit?'<span class="tag">红线</span>':'<span class="tag blue">规范</span>'}</b><p>${x.d}</p></div>`;
      row.querySelector('input').addEventListener('change',e=>{ state.checked[x.key]=e.target.checked; save(); render(); });
      box.appendChild(row);
    });
    app.appendChild(box);
  });
  // recount true totals (not filtered)
  let T=0,D=0; CONFIG.sections.forEach(s=>s.items.forEach((_,i)=>{T++; if(state.checked[s.id+"-"+i]) D++;}));
  document.getElementById('totalN').textContent=T; document.getElementById('doneN').textContent=D;
  const pct=T?Math.round(D/T*100):0; document.getElementById('pct').textContent=pct+"%"; document.getElementById('barFill').style.width=pct+"%";
}
function save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); }catch(e){} }
document.getElementById('q').addEventListener('input', render);
document.getElementById('themeBtn').onclick=()=>{ state.theme = state.theme==="bright"?"deep":"bright"; save(); render(); };
document.getElementById('resetBtn').onclick=()=>{ if(confirm("重置全部勾选？")){ state.checked={}; save(); render(); } };
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"xiaohuaidan-qc",version:CONFIG.version,...state},null,2)],{type:"application/json"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="小坏蛋自检台备份-"+CONFIG.version+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),800);
};
document.getElementById('importBtn').onclick=()=>document.getElementById('file').click();
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const p=JSON.parse(r.result); if(p.dataVersion!==CONFIG.dataVersion){ alert("数据版本不匹配，已拒绝导入"); return; } state.checked=p.checked||{}; state.theme=p.theme||"deep"; save(); render(); alert("导入成功"); }catch(err){ alert("导入失败：文件不对"); } };
  r.readAsText(f);
});
document.getElementById('copyBtn').onclick=async()=>{
  let T=0,D=0; const lines=[`小坏蛋开工自检 · ${CONFIG.version} · 2026-10-20`];
  CONFIG.sections.forEach(s=>{ const d=s.items.filter((_,i)=>state.checked[s.id+"-"+i]).length; T+=s.items.length; D+=d; lines.push(`${s.icon} ${s.title}：${d}/${s.items.length}`); });
  lines.push(`总进度：${D}/${T}（${T?Math.round(D/T*100):0}%）`);
  const txt=lines.join("\n");
  try{ await navigator.clipboard.writeText(txt); alert("已复制，可直接粘贴发出去"); }catch(e){ prompt("复制这段自检结果", txt); }
};
render();
</script>
</body>
</html>
