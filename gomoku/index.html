<div id="modal"><div class="box"><h3 id="mTitle"></h3><p id="mText"></p><button class="btn main" id="mBtn" style="padding:10px 22px">再来一局</button><button class="btn" id="mBtn3" style="padding:10px 16px;margin-left:8px">↩️ 悔棋一步</button></div></div>
<script>
"use strict";
const VERSION="20261024-3";
const SKEY="hema-gomoku-inf-v1";
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
let W=390,H=500, base=36, scale=1, ox=0, oy=0; // ox,oy = 棋盘(0,0)在画布上的像素位置
let stones=new Map(); // "x,y" -> 1黑/2白
let hist=[]; // {x,y,c}
let turn=1, mode="self", over=false, winLine=null, lastMove=null;
let selfRunning=false, selfTimer=null;
const key=(x,y)=>x+","+y;
function cell(){return base*scale}
function save(){try{localStorage.setItem(SKEY,JSON.stringify({v:2,stones:[...stones.entries()].map(([k,c])=>{const[x,y]=k.split(",").map(Number);return[x,y,c]}),turn,mode,scale}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SKEY)||"null");if(!d)return false;
  stones=new Map(d.stones.map(([x,y,c])=>[key(x,y),c]));hist=d.stones.map(([x,y,c])=>({x,y,c}));
  turn=d.turn||1;mode=d.v===2?(d.mode||"self"):"self";scale=d.scale||1;return true}catch(e){return false}}
function resize(){
  const w=Math.min(window.innerWidth-24,560);
  cv.width=w; cv.height=Math.min(Math.round(w*1.28),640); W=cv.width; H=cv.height;
  if(!loadDone){ox=W/2;oy=H/2}
  draw();
}
let loadDone=false;
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#dfb96e";ctx.fillRect(0,0,W,H);
  const cs=cell();
  // 网格线（只画可见范围）
  const x0=Math.floor((0-ox)/cs)-1, x1=Math.ceil((W-ox)/cs)+1;
  const y0=Math.floor((0-oy)/cs)-1, y1=Math.ceil((H-oy)/cs)+1;
  ctx.strokeStyle="rgba(90,55,10,.55)";ctx.lineWidth=1;ctx.beginPath();
  for(let x=x0;x<=x1;x++){ctx.moveTo(ox+x*cs,0);ctx.lineTo(ox+x*cs,H)}
  for(let y=y0;y<=y1;y++){ctx.moveTo(0,oy+y*cs);ctx.lineTo(W,oy+y*cs)}
  ctx.stroke();
  // 每5格一个定位点
  ctx.fillStyle="rgba(90,55,10,.6)";
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){if(x%5===0&&y%5===0){ctx.beginPath();ctx.arc(ox+x*cs,oy+y*cs,2.2,0,7);ctx.fill()}}
  // 棋子
  for(const[k,c]of stones){const[x,y]=k.split(",").map(Number);const px=ox+x*cs,py=oy+y*cs;
    if(px<-cs||px>W+cs||py<-cs||py>H+cs)continue;
    ctx.beginPath();ctx.arc(px,py,cs*0.44,0,7);
    ctx.fillStyle=c===1?"#111":"#fff";ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle="rgba(0,0,0,.35)";ctx.stroke();
    if(lastMove&&lastMove.x===x&&lastMove.y===y){ctx.beginPath();ctx.arc(px,py,cs*0.2,0,7);ctx.fillStyle="#ff4040";ctx.fill()}}
  // 胜负连线
  if(winLine){ctx.beginPath();const f=winLine[0],l=winLine[4];
    ctx.moveTo(ox+f.x*cs,oy+f.y*cs);ctx.lineTo(ox+l.x*cs,oy+l.y*cs);
    ctx.strokeStyle="#ff2222";ctx.lineWidth=3;ctx.stroke()}
}
function setStatus(t){$("status").innerHTML=t}
function refresh(){
  const nb=[...stones.values()].filter(c=>c===1).length, nw=[...stones.values()].filter(c=>c===2).length;
  const last=lastMove?" · 上一步："+(lastMove.c===1?"⚫ 黑":"⚪ 白")+" ("+lastMove.x+","+lastMove.y+")":"";
  if(over)setStatus("🏁 已分胜负 · 共 "+hist.length+" 手 · ⚫ "+nb+" 子 · ⚪ "+nw+" 子"+last);
  else if(mode==="self")setStatus("🤖 小坏蛋自己下：黑方 AI vs 白方 AI · 🛡️ 两边都是不败引擎 · "+(selfRunning?"▶️ 进行中":"⏸ 已暂停")+" · 共 "+hist.length+" 手 · ⚫ "+nb+" 子 · ⚪ "+nw+" 子"+last);
  else setStatus((turn===1?"⚫ 该黑子下":"⚪ 该白子下")+" · 共 "+hist.length+" 手 · ⚫ "+nb+" 子 · ⚪ "+nw+" 子"+last+" · 模式："+(mode==="alt"?"手动轮换":"手动自由选色"));
  $("btnColor").textContent=mode==="self"?"🤖 小坏蛋自弈中":(turn===1?"⚫ 该黑子下":"⚪ 该白子下");
  $("btnSelf").textContent=selfRunning?"⏸ 暂停自弈":"▶️ 开始自弈";
  $("selMode").value=mode;draw();save();
}
function checkWin(x,y,c){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const[dx,dy]of dirs){let line=[{x,y}];
    for(const sgn of[1,-1]){let nx=x+dx*sgn,ny=y+dy*sgn;
      while(stones.get(key(nx,ny))===c){line.push({x:nx,y:ny});nx+=dx*sgn;ny+=dy*sgn}}
    if(line.length>=5){line.sort((a,b2)=>(a.x*dx+a.y*dy)-(b2.x*dx+b2.y*dy));return line.slice(0,5)}}
  return null;
}
function place(x,y,byUser){
  if(over)return false;
  if(byUser&&mode==="self"){setStatus("🤖 自弈模式下棋子由小坏蛋自己下，你在旁边看就行；想自己下请切到手动轮换 / 自由选色。");return false}
  if(stones.has(key(x,y))){if(byUser)setStatus("⛔ 这里已经有子了，换个空位。");return false}
  stones.set(key(x,y),turn);hist.push({x,y,c:turn});lastMove={x,y,c:turn};
  const wl=checkWin(x,y,turn);
  if(wl){over=true;winLine=wl;refresh();
    $("mTitle").textContent=turn===1?"⚫ 黑方五连，胜！":"⚪ 白方五连，胜！";
    $("mText").innerHTML="第 "+hist.length+" 手分出胜负，位置 ("+x+","+y+")。<br>一个人下两边，复盘就点「↩️ 悔棋一步」退回去，或者直接再来一局。";
    $("modal").style.display="flex";return true}
  if(mode==="alt"||mode==="self")turn=turn===1?2:1;
  refresh();return true;
}
/* ---------- 小坏蛋自弈 AI（无限棋盘版） ---------- */
function lineScoreMap(x,y,c){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];let total=0;
  for(const[dx,dy]of dirs){let cnt=1,open=0;
    for(const sgn of[1,-1]){let nx=x+dx*sgn,ny=y+dy*sgn;
      while(stones.get(key(nx,ny))===c){cnt++;nx+=dx*sgn;ny+=dy*sgn}
      if(!stones.has(key(nx,ny)))open++}
    if(cnt>=5)total+=1000000;else if(cnt===4)total+=open===2?120000:open===1?15000:0;
    else if(cnt===3)total+=open===2?3500:open===1?500:0;
    else if(cnt===2)total+=open===2?260:open===1?60:0;else total+=open?8:0}
  return total;
}
function candidates(){
  const cand=new Map();
  for(const[k]of stones){const[x,y]=k.split(",").map(Number);
    for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){const nx=x+dx,ny=y+dy;if(!stones.has(key(nx,ny)))cand.set(key(nx,ny),{x:nx,y:ny})}}
  return [...cand.values()];
}
function heur(m,c){const o=c===1?2:1;return lineScoreMap(m.x,m.y,c)+0.95*lineScoreMap(m.x,m.y,o)}
function winCells(c,list){return (list||candidates()).filter(m=>lineScoreMap(m.x,m.y,c)>=1000000)}
/* 🛡️ 不败引擎（黑白两边同一套）：必胜先下 → 必堵 → 造双重威胁 → 破对方双重威胁 → 两层搜索 */
function aiPick(){
  if(!stones.size)return{x:0,y:0};
  const me=turn, opp=me===1?2:1;
  const cand=candidates();
  for(const m of cand)if(lineScoreMap(m.x,m.y,me)>=1000000)return m; // 1. 我有必胜点
  const oppWin=winCells(opp,cand);
  if(oppWin.length===1)return oppWin[0]; // 2. 对方唯一必胜点，必堵
  if(oppWin.length>1){let bb=null,bv=-1;for(const m of oppWin){const v=heur(m,me);if(v>bv){bv=v;bb=m}}return bb} // 已无解，堵最赚的一个
  const scored=cand.map(m=>({m,s:heur(m,me)})).sort((a,b2)=>b2.s-a.s);
  for(const {m} of scored.slice(0,24)){ // 3. 造双重威胁：落子后出现≥2个必胜点，对方一手堵不完
    stones.set(key(m.x,m.y),me);const wc=winCells(me);stones.delete(key(m.x,m.y));
    if(wc.length>=2)return m}
  for(const {m} of scored.slice(0,24)){ // 4. 破对方双重威胁：先占对方双重威胁的一个必胜点
    stones.set(key(m.x,m.y),opp);const wc=winCells(opp);stones.delete(key(m.x,m.y));
    if(wc.length>=2){let bb=null,bv=-1;for(const w of wc){const v=heur(w,me);if(v>bv){bv=v;bb=w}}return bb}}
  let best=null,bv=-1e18; // 5. 两层搜索：我一手 − 对方最优回应×0.95 ＋ 我再一手×0.45
  for(const {m,s} of scored.slice(0,12)){
    stones.set(key(m.x,m.y),me);
    const oc=candidates();let oppBest=-1e18,oppMove=null;
    for(const om of oc){const v=heur(om,opp);if(v>oppBest){oppBest=v;oppMove=om}}
    let my2=0;
    if(oppMove){stones.set(key(oppMove.x,oppMove.y),opp);
      for(const mm of candidates()){const v=heur(mm,me);if(v>my2)my2=v}
      stones.delete(key(oppMove.x,oppMove.y));}
    stones.delete(key(m.x,m.y));
    const total=s-oppBest*0.95+my2*0.45+Math.random()*6;
    if(total>bv){bv=total;best=m}}
  return best||scored[0].m;
}
function aiStep(){
  if(over||mode!=="self")return false;
  const m=aiPick();if(!m)return false;
  const ok=place(m.x,m.y,false);
  if(ok&&lastMove)centerOn(lastMove.x,lastMove.y);
  if(over)stopSelf();
  return ok;
}
function startSelf(){
  if(mode!=="self")return;
  if(over)return;
  stopSelf();selfRunning=true;
  selfTimer=setInterval(()=>{if(!aiStep())stopSelf()},+$("selSpeed").value);
  refresh();
}
function stopSelf(){selfRunning=false;if(selfTimer){clearInterval(selfTimer);selfTimer=null}refresh()}
function undo(){
  if(!hist.length)return false;
  const m=hist.pop();stones.delete(key(m.x,m.y));
  lastMove=hist.length?hist[hist.length-1]:null;winLine=null;over=false;
  if(mode==="alt"||mode==="self")turn=m.c; // 退回被悔掉的那一方的回合
  $("modal").style.display="none";refresh();return true;
}
function centerOn(x,y){ox=W/2-x*cell();oy=H/2-y*cell();draw()}
function zoomAt(f,cx,cy){
  const bx=(cx-ox)/cell(), by=(cy-oy)/cell();
  scale=Math.min(2.6,Math.max(0.45,scale*f));
  ox=cx-bx*cell();oy=cy-by*cell();draw();
}
$("btnColor").onclick=()=>{if(mode==="free"){turn=turn===1?2:1;refresh()}else if(mode==="self")setStatus("🤖 自弈模式：黑白都由小坏蛋自己下，不用你选颜色。");
  else setStatus("轮换模式下颜色自动轮换；想手动选子请切到「自由选色」模式。")};
$("selMode").onchange=e=>{const v=e.target.value;stopSelf();mode=v;refresh()};
$("btnSelf").onclick=()=>{if(mode!=="self"){mode="self";$("selMode").value="self"}
  if(selfRunning)stopSelf();else startSelf()};
$("btnStep").onclick=()=>{stopSelf();if(mode!=="self"){mode="self";$("selMode").value="self"}if(!aiStep())setStatus("这局已经结束了，点新棋局重开一盘自弈。")};
$("selSpeed").onchange=()=>{if(selfRunning)startSelf()};
$("btnUndo").onclick=()=>{stopSelf();if(!undo())setStatus("没棋可悔，这才刚开局。")};
let armNew=false,armTimer=null;
$("btnNew").onclick=()=>{
  if(!armNew){armNew=true;$("btnNew").textContent="⚠️ 点我确认清空？";armTimer=setTimeout(()=>{armNew=false;$("btnNew").textContent="🗑️ 新棋局"},3000);return}
  clearTimeout(armTimer);armNew=false;$("btnNew").textContent="🗑️ 新棋局";
  stopSelf();stones=new Map();hist=[];turn=1;over=false;winLine=null;lastMove=null;ox=W/2;oy=H/2;refresh();
  if(mode==="self")setTimeout(startSelf,400);
};
$("btnZoomIn").onclick=()=>zoomAt(1.25,W/2,H/2);
$("btnZoomOut").onclick=()=>zoomAt(0.8,W/2,H/2);
$("btnLast").onclick=()=>{if(lastMove)centerOn(lastMove.x,lastMove.y);else centerOn(0,0)};
$("btnCenter").onclick=()=>centerOn(0,0);
$("mBtn").onclick=()=>{$("modal").style.display="none";$("btnNew").click();$("btnNew").click()};
$("mBtn3").onclick=()=>{if(!undo())setStatus("没棋可悔。")};
/* 指针：点=落子，拖=平移，双指=缩放 */
const pointers=new Map();let downPos=null,dragged=false,pinchD=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){downPos={x:e.clientX,y:e.clientY,ox,oy};dragged=false}
  else if(pointers.size===2){const[a,b]=[...pointers.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const[a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD>0){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const r=cv.getBoundingClientRect();zoomAt(d/pinchD,mx-r.left,my-r.top)}
    pinchD=d;dragged=true;return}
  if(downPos){const dx=e.clientX-downPos.x,dy=e.clientY-downPos.y;
    if(Math.abs(dx)+Math.abs(dy)>7){dragged=true;ox=downPos.ox+dx;oy=downPos.oy+dy;draw()}}});
function endPointer(e){
  const wasDrag=dragged;pointers.delete(e.pointerId);if(pointers.size<2)pinchD=0;downPos=null;
  if(!wasDrag&&pointers.size===0){
    const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
    const bx=Math.round((px-ox)/cell()),by=Math.round((py-oy)/cell());place(bx,by,true)}
}
cv.addEventListener("pointerup",endPointer);cv.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);downPos=null});
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:0.87,e.clientX-r.left,e.clientY-r.top)},{passive:false});
window.addEventListener("resize",resize);
loadDone=load();resize();
if(hist.length)centerOn(lastMove.x,lastMove.y);else centerOn(0,0);
refresh();
if(mode==="self"&&!hist.length)setTimeout(startSelf,900);
window.__gomokuTest={place,aiStep,aiPick,setBoard:(arr,t)=>{stones=new Map(arr.map(([x,y,c])=>[key(x,y),c]));hist=arr.map(([x,y,c])=>({x,y,c}));turn=t;over=false;winLine=null;lastMove=hist.length?hist[hist.length-1]:null;refresh()},getState:()=>({moves:hist.length,turn,over,mode,selfRunning,black:[...stones.values()].filter(c=>c===1).length})};
